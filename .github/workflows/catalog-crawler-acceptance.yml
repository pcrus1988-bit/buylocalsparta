name: Catalogue Crawler Acceptance

on:
  pull_request:
    paths:
      - "workers/catalog-crawler/**"
      - "workers/catalog-crawler-worker.ts"
      - "workers/catalog-crawler.test.ts"
      - "packages/core/src/ingestion/**"
      - "packages/core/test/ingestion*.test.ts"
      - "db/migrations/0130_catalog_web_crawl_job_leases.sql"
      - "db/migrations/0136_catalog_web_crawler_operations.sql"
      - "db/migrations/checksums.0130.json"
      - "db/migrations/checksums.0136.json"
      - "deploy/worker-entrypoint.sh"
      - "deploy/worker.env.example"
      - "scripts/catalog-crawler-operations-smoke.sql"
      - "scripts/catalog-crawl-promotion-readiness.test.ts"
      - "scripts/verify-deployment-topology.ts"
      - "docs/CATALOG_CRAWLER_WORKER.md"
      - "packages/postgres-runtime/src/index.ts"
      - "apps/web/src/lib/admin-catalogue-crawler.ts"
      - "apps/web/src/lib/catalogue-crawler-promotion-readiness.ts"
      - "apps/web/src/app/admin/catalogue-crawler/**"
      - ".github/workflows/catalog-crawler-acceptance.yml"

jobs:
  crawler:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: buy_local_sparta
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: buy_local_sparta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buy_local_sparta -d buy_local_sparta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buy_local_sparta:ci-password@127.0.0.1:5432/buy_local_sparta
      BLS_AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BLS_ENABLE_DEMO_ACCOUNTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked workspace
        run: npm ci --ignore-scripts
      - name: Verify crawler migration checksum and topology
        run: |
          sha256sum db/migrations/0136_catalog_web_crawler_operations.sql
          npm run db:verify
          node --experimental-strip-types scripts/verify-deployment-topology.ts
      - name: Bootstrap Supabase-compatible roles and Vault contract
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(), name text UNIQUE, description text,
            secret text NOT NULL, key_id uuid, nonce bytea,
            created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE VIEW vault.decrypted_secrets AS
            SELECT id,name,description,secret,secret AS decrypted_secret,key_id,nonce,created_at,updated_at FROM vault.secrets;
          CREATE OR REPLACE FUNCTION vault.create_secret(new_secret text,new_name text,new_description text,new_key_id uuid)
          RETURNS uuid LANGUAGE plpgsql AS $$
          DECLARE created_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO vault.secrets(id,secret,name,description,key_id) VALUES(created_id,new_secret,new_name,new_description,new_key_id);
            RETURN created_id;
          END;
          $$;
          SQL
      - name: Apply current schema and verify readiness
        run: |
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT bls_platform_runtime TO buy_local_sparta"
          npm run db:ready
      - name: Typecheck crawler worker
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck workers/catalog-crawler-worker.ts
      - name: Test crawler discovery, transport and orchestration
        run: |
          node --experimental-strip-types --test packages/core/test/ingestion.test.ts packages/core/test/ingestion-discovery.test.ts
          node --experimental-strip-types --test workers/catalog-crawler.test.ts
      - name: Test shared PIM promotion readiness contract
        run: node --experimental-strip-types --test scripts/catalog-crawl-promotion-readiness.test.ts
      - name: Verify crawler operations lifecycle
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/catalog-crawler-operations-smoke.sql
      - name: Verify crawler functions exist
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regprocedure('bls_private.queue_catalog_web_crawl_job(uuid,text,text,uuid,text,text)') IS NOT NULL AS queue_exists \gset
          SELECT to_regprocedure('bls_private.claim_catalog_web_crawl_job(text,integer)') IS NOT NULL AS claim_exists \gset
          SELECT to_regprocedure('bls_private.renew_catalog_web_crawl_job_lease(uuid,text,integer)') IS NOT NULL AS renew_exists \gset
          SELECT to_regprocedure('bls_private.request_catalog_web_crawl_job_cancel(uuid)') IS NOT NULL AS cancel_exists \gset
          SELECT to_regprocedure('bls_private.catalog_web_crawl_job_should_cancel(uuid,text)') IS NOT NULL AS should_cancel_exists \gset
          SELECT to_regprocedure('bls_private.acknowledge_catalog_web_crawl_job_cancel(uuid,text)') IS NOT NULL AS ack_cancel_exists \gset
          SELECT to_regprocedure('bls_private.catalog_web_crawl_queue_health()') IS NOT NULL AS health_exists \gset
          SELECT to_regprocedure('bls_private.finish_catalog_web_crawl_job(uuid,text)') IS NOT NULL AS finish_exists \gset
          SELECT to_regprocedure('bls_private.retry_catalog_web_crawl_job(uuid,text,text,integer,boolean)') IS NOT NULL AS retry_exists \gset
          \if :queue_exists
          \else
            \quit 1
          \endif
          \if :claim_exists
          \else
            \quit 1
          \endif
          \if :renew_exists
          \else
            \quit 1
          \endif
          \if :cancel_exists
          \else
            \quit 1
          \endif
          \if :should_cancel_exists
          \else
            \quit 1
          \endif
          \if :ack_cancel_exists
          \else
            \quit 1
          \endif
          \if :health_exists
          \else
            \quit 1
          \endif
          \if :finish_exists
          \else
            \quit 1
          \endif
          \if :retry_exists
          \else
            \quit 1
          \endif
          SQL
