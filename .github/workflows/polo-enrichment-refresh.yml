name: POLO enrichment refresh

on:
  push:
    branches:
      - chore/polo-catalogue-crawl
    paths:
      - scripts/catalogue/enrich-polo-browser-v2.mjs
      - scripts/catalogue/enrich-polo-external.mjs
      - .github/workflows/polo-enrichment-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polo-enrichment-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Apply authoritative POLO enrichment
        id: primary
        shell: bash
        run: |
          set -o pipefail
          node scripts/catalogue/enrich-polo-browser-v2.mjs 2>&1 | tee /tmp/polo-enrichment-v2.log

      - name: Apply exact-SKU external enrichment
        if: hashFiles('scripts/catalogue/enrich-polo-external.mjs') != ''
        shell: bash
        run: |
          set -o pipefail
          node scripts/catalogue/enrich-polo-external.mjs 2>&1 | tee /tmp/polo-external-enrichment.log

      - name: Upload refreshed POLO import package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polo-enriched-catalogue-${{ github.run_id }}
          path: |
            data/imports/polo/
            /tmp/polo-enrichment-v2.log
            /tmp/polo-external-enrichment.log
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed POLO data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/polo
          if git diff --cached --quiet; then
            echo 'No POLO enrichment changes to commit.'
            exit 0
          fi
          git commit -m 'data: apply authoritative POLO enrichment [skip ci]'
          git push origin HEAD:chore/polo-catalogue-crawl
