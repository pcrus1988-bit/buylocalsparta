name: Admin Supplier PIM Intake Acceptance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify read-only PIM intake governance
        run: node --experimental-strip-types scripts/verify-admin-catalogue-intake.ts
