name: Catalogue intake automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalogue-intake-automation.yml"
      - "workers/catalogue-intake-automation-worker.ts"
      - "apps/web/src/app/api/internal/catalogue-intake-cycle/route.ts"
      - "apps/web/src/lib/catalogue-intake-automation-runtime.ts"
      - "apps/web/src/lib/github-actions-oidc.ts"
      - "apps/web/src/lib/admin-catalogue-intake.ts"
      - "apps/web/src/lib/admin-catalogue-operations.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalogue-intake-automation
  cancel-in-progress: false

jobs:
  run:
    name: Intelligence and canonicalization cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOGUE_INTAKE_ENDPOINT: https://kontamou.site/api/internal/catalogue-intake-cycle
      CATALOGUE_INTAKE_AUDIENCE: kontamou-catalogue-intake

    steps:
      - name: Run authenticated catalogue intake cycle
        shell: bash
        run: |
          set -euo pipefail

          response_file="${RUNNER_TEMP}/catalogue-intake-response.json"
          for attempt in $(seq 1 12); do
            oidc_response="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CATALOGUE_INTAKE_AUDIENCE}")"
            oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value // empty')"
            if [[ -z "${oidc_token}" ]]; then
              echo "::error::GitHub OIDC provider did not return an ID token."
              exit 1
            fi

            status="$(curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --max-time 720 \
              --request POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              "${CATALOGUE_INTAKE_ENDPOINT}")"

            cat "${response_file}" || true
            echo

            if [[ "${status}" -ge 200 && "${status}" -lt 300 ]]; then
              exit 0
            fi
            if [[ "${status}" == "401" || "${status}" == "403" ]]; then
              echo "::error::KONTA MOU rejected the GitHub OIDC identity (HTTP ${status})."
              exit 1
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "::error::Catalogue intake endpoint did not become healthy (last HTTP ${status})."
              exit 1
            fi

            echo "Catalogue intake endpoint returned HTTP ${status}; retrying after deployment/transient delay."
            sleep 15
          done
