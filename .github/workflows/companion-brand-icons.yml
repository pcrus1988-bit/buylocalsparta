name: Companion official Android icons
on:
  pull_request:
    paths:
      - .github/workflows/companion-brand-icons.yml
      - mobile/scripts/generate_brand_icons.py
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'pcrus1988-bit/buylocalsparta' && github.event.pull_request.number == 1553 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/native-customer-app-foundation-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-customer-app-foundation-20261016
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install 'Pillow==11.3.0'
      - name: Render official wordmark into Android icons
        run: python mobile/scripts/generate_brand_icons.py
      - name: Commit generated brand icons to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/icon.png mobile/assets/adaptive-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "brand(companion): official KONTA MOY Android icons"
            git push origin HEAD:refs/heads/feature/native-customer-app-foundation-20261016
          fi
