name: NOVA availability production

on:
  workflow_dispatch:
    inputs:
      refresh_full_read_models:
        description: "Also rebuild the large materialized storefront read models"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nova-availability-production.yml"
      - "workers/nova-availability-worker.ts"
      - "apps/web/src/lib/nova-availability-refresh-runtime.ts"
      - "integrations/dropship-suppliers/src/nova-v1.ts"

permissions:
  contents: read

concurrency:
  group: nova-availability-production
  cancel-in-progress: false

jobs:
  refresh:
    name: BrandsGateway availability + storefront projections
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NOVA_API_KEY: ${{ secrets.NOVA_API_KEY }}
      PGSSLMODE: require
      BLS_DB_APPLICATION_NAME: github-actions:nova-availability
      BLS_DB_CONNECT_TIMEOUT_MS: "30000"
      BLS_DB_POOL_MAX: "2"
      BLS_NOVA_AVAILABILITY_REQUESTS_PER_MINUTE: "60"
      BLS_NOVA_AVAILABILITY_PAGE_CONCURRENCY: "12"
      BLS_NOVA_FULL_PROJECTION_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_full_read_models }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production credentials
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::GitHub Actions secret DATABASE_URL is missing."
            exit 78
          fi
          if [[ -z "${NOVA_API_KEY}" ]]; then
            echo "::error::GitHub Actions secret NOVA_API_KEY is missing."
            exit 78
          fi

      - name: Refresh BrandsGateway availability and storefront projections
        run: node --experimental-strip-types --loader ./scripts/resolve-typescript-extension.mjs workers/nova-availability-worker.ts
