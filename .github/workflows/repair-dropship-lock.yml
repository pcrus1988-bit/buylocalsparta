name: Repair Dropship Workspace Lock

on:
  push:
    paths:
      - '.github/workflows/repair-dropship-lock.yml'

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate root package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit deterministic lock update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): register dropship supplier workspace lock"
          git push origin HEAD:main
