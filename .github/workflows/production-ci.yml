name: Production CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: buy_local_sparta
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: buy_local_sparta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buy_local_sparta -d buy_local_sparta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buy_local_sparta:ci-password@127.0.0.1:5432/buy_local_sparta
      BLS_AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BLS_ENABLE_DEMO_ACCOUNTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify dependency-free domain/runtime suite
        run: npm run check
      - name: Typecheck Core
        run: npm run typecheck:core
      - name: Typecheck Viva payment adapter
        run: npm run typecheck:viva
      - name: Typecheck AADE myDATA ERP adapter
        run: npm run typecheck:mydata
      - name: Typecheck Meilisearch search adapter
        run: npm run typecheck:search-provider
      - name: Typecheck Resend notification adapter
        run: npm run typecheck:resend
      - name: Typecheck BOX NOW shipping adapter
        run: npm run typecheck:boxnow
      - name: Typecheck object-storage adapter
        run: npm run typecheck:object-storage
      - name: Typecheck media processing adapter
        run: npm run typecheck:media-processing
      - name: Typecheck media worker
        run: npm run typecheck:media-worker
      - name: Typecheck PostgreSQL runtime
        run: npm run typecheck:postgres-runtime
      - name: Typecheck live database smoke
        run: npm run typecheck:db-smoke
      - name: Typecheck staging activation tooling
        run: npm run typecheck:activation
      - name: Bootstrap Supabase role and Vault topology
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $$;

          -- Supabase provides the Vault schema in hosted projects. The plain PostGIS
          -- service used by CI does not, so reproduce only the narrow SQL contract
          -- required to compile/test migration 0084. Production continues to use
          -- Supabase Vault itself; this compatibility surface exists only in CI.
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text UNIQUE,
            description text,
            secret text NOT NULL,
            key_id uuid,
            nonce bytea,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE VIEW vault.decrypted_secrets AS
            SELECT id, name, description, secret, secret AS decrypted_secret,
                   key_id, nonce, created_at, updated_at
            FROM vault.secrets;
          CREATE OR REPLACE FUNCTION vault.create_secret(
            new_secret text,
            new_name text,
            new_description text,
            new_key_id uuid
          ) RETURNS uuid
          LANGUAGE plpgsql
          AS $$
          DECLARE
            created_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO vault.secrets(id, secret, name, description, key_id)
            VALUES(created_id, new_secret, new_name, new_description, new_key_id);
            RETURN created_id;
          END;
          $$;
          SQL
      - name: Apply PostgreSQL/PostGIS migrations
        run: npm run db:migrate
      - name: Bind CI platform runtime credential
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT bls_platform_runtime TO buy_local_sparta"
      - name: Verify database readiness
        run: npm run db:ready
      - name: Bootstrap governed DB smoke vendor finance fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(email,password_hash,status,email_verified_at)
          VALUES('ci-agreement-signer@example.test','ci-only-not-a-runtime-password','active',now())
          ON CONFLICT (email) DO UPDATE SET status='active',email_verified_at=now();

          INSERT INTO users(email,password_hash,status,email_verified_at)
          VALUES('ci-finance-checker@example.test','ci-only-not-a-runtime-password','active',now())
          ON CONFLICT (email) DO UPDATE SET status='active',email_verified_at=now();

          CREATE OR REPLACE FUNCTION bls_private.ci_seed_db_smoke_vendor_agreement()
          RETURNS trigger
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = pg_catalog, public, bls_private
          AS $$
          DECLARE
            signer_id uuid;
            checker_id uuid;
          BEGIN
            IF NEW.public_id NOT LIKE 'vendor_db_smoke_%'
               AND NEW.public_id NOT LIKE 'vendor_rescue_db_smoke_%' THEN
              RETURN NEW;
            END IF;

            SELECT id INTO signer_id
            FROM public.users
            WHERE email='ci-agreement-signer@example.test'
            LIMIT 1;

            SELECT id INTO checker_id
            FROM public.users
            WHERE email='ci-finance-checker@example.test'
            LIMIT 1;

            INSERT INTO public.vendor_commercial_agreements(
              market_id,
              vendor_id,
              agreement_code,
              agreement_version,
              status,
              starts_at,
              signed_at,
              commission_rate_bps,
              commission_basis,
              commission_tax_mode,
              commission_tax_rate_bps,
              source_document_reference,
              terms_snapshot,
              vendor_snapshot,
              commercial_terms_snapshot,
              signed_pdf_object_key,
              signed_pdf_sha256,
              signed_document_received_at,
              govgr_reference,
              govgr_verified_at,
              govgr_verified_by,
              activated_at,
              activated_by
            ) VALUES (
              NEW.market_id,
              NEW.id,
              'CI-SMOKE-' || NEW.public_id,
              1,
              'active',
              now() - interval '1 day',
              now(),
              500,
              'merchandise_gross',
              'included',
              2400,
              'ci://synthetic-governed-agreement/' || NEW.public_id,
              jsonb_build_object('fixture','db-integration-smoke'),
              jsonb_build_object('vendorPublicId',NEW.public_id),
              jsonb_build_object('commissionRateBps',500),
              'ci-smoke/' || NEW.public_id || '/signed.pdf',
              repeat('a',64),
              now(),
              'CI-SMOKE-GOVGR-' || NEW.public_id,
              now(),
              signer_id,
              now(),
              signer_id
            );

            INSERT INTO public.vendor_payout_destinations(
              vendor_id,
              provider,
              provider_reference,
              display_label,
              masked_account,
              account_holder,
              status,
              verified_by,
              verified_at,
              effective_at,
              metadata,
              created_by,
              created_at,
              updated_at
            ) VALUES (
              NEW.id,
              'bank_transfer',
              'ci-vault-token-' || NEW.public_id,
              'CI payout destination',
              'GR••••0001',
              'CI Smoke Vendor',
              'verified',
              checker_id,
              now(),
              now() - interval '1 minute',
              jsonb_build_object('fixture','db-integration-smoke','makerChecker',true),
              signer_id,
              now(),
              now()
            );
            RETURN NEW;
          END;
          $$;

          DROP TRIGGER IF EXISTS ci_seed_db_smoke_vendor_agreement ON public.vendor_businesses;
          CREATE TRIGGER ci_seed_db_smoke_vendor_agreement
          AFTER INSERT ON public.vendor_businesses
          FOR EACH ROW
          WHEN (
            NEW.public_id LIKE 'vendor_db_smoke_%'
            OR NEW.public_id LIKE 'vendor_rescue_db_smoke_%'
          )
          EXECUTE FUNCTION bls_private.ci_seed_db_smoke_vendor_agreement();
          SQL
      - name: Run live database integration smoke
        run: npm run db:smoke
      - name: Disable DB smoke finance fixture
        if: always()
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TRIGGER IF EXISTS ci_seed_db_smoke_vendor_agreement ON public.vendor_businesses;
          DROP FUNCTION IF EXISTS bls_private.ci_seed_db_smoke_vendor_agreement();
          SQL
      - name: Typecheck all long-running workers
        run: npm run typecheck:workers
      - name: Build production worker container
        run: docker build -f deploy/worker.Dockerfile -t buy-local-sparta-worker:ci .
      - name: Build production Next.js application
        run: npm run check:web
      - name: Smoke built Next.js SEO and privacy contracts
        run: node scripts/verify-seo-http-smoke.mjs
