name: Companion Android dependency lockfile
on:
  pull_request:
    paths:
      - .github/workflows/companion-generate-lockfile.yml
      - mobile/package.json
permissions:
  contents: write
concurrency:
  group: companion-android-lockfile-pr
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'pcrus1988-bit/buylocalsparta' && github.event.pull_request.number == 1553 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/native-customer-app-foundation-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-customer-app-foundation-20261016
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate reproducible Android lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify fresh install from lockfile
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Android source
        working-directory: mobile
        run: npm run check
      - name: Verify Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check
      - name: Attach verified Android lockfile
        uses: actions/upload-artifact@v4
        with:
          name: companion-android-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error
      - name: Commit verified lockfile to same-repo draft PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(companion): verified reproducible Android lockfile"
            git push origin HEAD:refs/heads/feature/native-customer-app-foundation-20261016
          fi
