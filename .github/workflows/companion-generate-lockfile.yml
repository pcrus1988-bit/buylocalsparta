name: Companion Android dependency lockfile
on:
  push:
    branches:
      - feature/native-customer-app-foundation-20261016
    paths:
      - .github/workflows/companion-generate-lockfile.yml
permissions:
  contents: write
concurrency:
  group: companion-android-lockfile
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'pcrus1988-bit/buylocalsparta' && github.ref == 'refs/heads/feature/native-customer-app-foundation-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-customer-app-foundation-20261016
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate reproducible Android lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify fresh install with lockfile
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck Android source
        working-directory: mobile
        run: npm run check
      - name: Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check
      - name: Commit verified lockfile only to draft feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(companion): commit verified Android npm lockfile"
            git push origin HEAD:refs/heads/feature/native-customer-app-foundation-20261016
          fi
