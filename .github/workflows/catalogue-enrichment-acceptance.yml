name: Catalogue Enrichment Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/lib/catalogue-enrichment.ts"
      - "apps/web/src/lib/catalogue-enrichment-runtime.ts"
      - "apps/web/src/lib/catalogue-enrichment-openai.ts"
      - "apps/web/src/lib/catalogue-enrichment-policy.ts"
      - "apps/web/src/lib/catalogue-enrichment-generation-runtime.ts"
      - "apps/web/src/lib/catalogue-enrichment*.test.ts"
      - "apps/web/src/lib/admin-catalogue-enrichment.ts"
      - "apps/web/src/app/admin/catalogue/enrichment/**"
      - "workers/nova-catalogue-worker.ts"
      - "scripts/verify-catalogue-enrichment.ts"
      - "db/migrations/0239_catalogue_enrichment_foundation.sql"
      - "db/migrations/checksums.0239.json"
      - ".github/workflows/catalogue-enrichment-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-enrichment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Verify enrichment safety contract
        run: node --experimental-strip-types scripts/verify-catalogue-enrichment.ts

      - name: Test catalogue enrichment grounding and pilot controls
        run: >-
          node --experimental-strip-types
          --loader ./scripts/resolve-typescript-extension.mjs
          --test
          apps/web/src/lib/catalogue-enrichment.test.ts
          apps/web/src/lib/catalogue-enrichment-generation.test.ts

      - name: Typecheck web enrichment and Admin QA integration
        run: npx tsc -p apps/web/tsconfig.json --noEmit --incremental false

      - name: Verify immutable migration manifest
        run: npm run db:verify

      - name: Verify project consistency
        run: npm run check:consistency

      - name: Typecheck long-running worker integration
        run: npm run typecheck:workers
