name: Diagnostic Web Build
on:
  push:
    branches:
      - diagnose/web-build-20260929

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: preview
      VERCEL_TARGET_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build web
        run: npm run build
