name: TIGER LIVE engine PR provenance checks

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/tiger-live-candidates.ts'
      - 'apps/web/src/lib/tiger-live-candidates.test.ts'
      - 'apps/web/src/lib/tiger-live.ts'
      - 'apps/web/src/components/TigerLiveControlRoom.tsx'
      - '.github/workflows/tiger-live-candidates.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify candidate PR provenance and negative cases
        run: cd apps/web && node --experimental-strip-types --test src/lib/tiger-live-candidates.test.ts
