name: Open Icecat Ingestion Acceptance

on:
  pull_request:
    paths:
      - "workers/open-icecat-worker.ts"
      - "workers/open-icecat-detail-worker.ts"
      - "packages/core/src/ingestion/open-icecat/**"
      - "packages/core/src/persistence/postgres-open-icecat-bulk.ts"
      - "packages/core/src/persistence/postgres-open-icecat-detail.ts"
      - "packages/core/src/persistence/bundle.ts"
      - "packages/core/src/persistence/index.ts"
      - "packages/core/test/open-icecat*.test.ts"
      - "db/migrations/0158_open_icecat_greek_product_intelligence.sql"
      - "db/migrations/0160_open_icecat_bulk_ingestion_runs.sql"
      - "db/migrations/0163_open_icecat_detail_enrichment.sql"
      - "db/migrations/checksums.0158.json"
      - "db/migrations/checksums.0160.json"
      - "db/migrations/checksums.0163.json"
      - "packages/postgres-runtime/src/index.ts"
      - "deploy/worker-entrypoint.sh"
      - "deploy/worker.env.example"
      - "scripts/open-icecat-detail-smoke.ts"
      - "scripts/verify-deployment-topology.ts"
      - "docs/OPEN_ICECAT_INGESTION_WORKER.md"
      - "docs/OPEN_ICECAT_DETAIL_ENRICHMENT_WORKER.md"
      - ".github/workflows/open-icecat-ingestion-acceptance.yml"

jobs:
  ingestion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: buy_local_sparta
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: buy_local_sparta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buy_local_sparta -d buy_local_sparta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buy_local_sparta:ci-password@127.0.0.1:5432/buy_local_sparta
      BLS_AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BLS_ENABLE_DEMO_ACCOUNTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked workspace
        run: npm ci --ignore-scripts
      - name: Verify migration ledger and deployment topology
        run: |
          sha256sum db/migrations/0160_open_icecat_bulk_ingestion_runs.sql
          sha256sum db/migrations/0163_open_icecat_detail_enrichment.sql
          npm run db:verify
          node --experimental-strip-types scripts/verify-deployment-topology.ts
      - name: Bootstrap Supabase-compatible roles and Vault contract
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(), name text UNIQUE, description text,
            secret text NOT NULL, key_id uuid, nonce bytea,
            created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE VIEW vault.decrypted_secrets AS
            SELECT id,name,description,secret,secret AS decrypted_secret,key_id,nonce,created_at,updated_at FROM vault.secrets;
          CREATE OR REPLACE FUNCTION vault.create_secret(new_secret text,new_name text,new_description text,new_key_id uuid)
          RETURNS uuid LANGUAGE plpgsql AS $$
          DECLARE created_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO vault.secrets(id,secret,name,description,key_id) VALUES(created_id,new_secret,new_name,new_description,new_key_id);
            RETURN created_id;
          END;
          $$;
          SQL
      - name: Apply current schema and verify readiness
        run: |
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT bls_platform_runtime TO buy_local_sparta"
          npm run db:ready
      - name: Typecheck Open Icecat workers and database smoke
        run: |
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck workers/open-icecat-worker.ts
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck workers/open-icecat-detail-worker.ts scripts/open-icecat-detail-smoke.ts
      - name: Test Open Icecat parser, transformer, client and resumable bulk runner
        run: node --experimental-strip-types --test packages/core/test/open-icecat*.test.ts
      - name: Exercise detail queue, Greek evidence, stale handling and full reconciliation
        run: node --experimental-strip-types scripts/open-icecat-detail-smoke.ts
      - name: Verify durable ingestion and detail schema isolation
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.open_icecat_bulk_ingestion_runs') IS NOT NULL AS runs_exists \gset
          SELECT to_regclass('public.open_icecat_index_products') IS NOT NULL AS index_exists \gset
          SELECT to_regclass('public.open_icecat_detail_enrichment_jobs') IS NOT NULL AS detail_exists \gset
          SELECT relrowsecurity AS runs_rls FROM pg_class WHERE oid='public.open_icecat_bulk_ingestion_runs'::regclass \gset
          SELECT relrowsecurity AS index_rls FROM pg_class WHERE oid='public.open_icecat_index_products'::regclass \gset
          SELECT relrowsecurity AS detail_rls FROM pg_class WHERE oid='public.open_icecat_detail_enrichment_jobs'::regclass \gset
          SELECT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conrelid='public.open_icecat_bulk_ingestion_runs'::regclass
              AND pg_get_constraintdef(oid) LIKE '%processing_version%'
          ) AS version_identity_exists \gset
          SELECT NOT has_table_privilege('anon','public.open_icecat_detail_enrichment_jobs','SELECT') AS anon_detail_denied \gset
          SELECT NOT has_table_privilege('authenticated','public.open_icecat_detail_enrichment_jobs','SELECT') AS auth_detail_denied \gset
          SELECT NOT has_table_privilege('service_role','public.open_icecat_detail_enrichment_jobs','SELECT') AS service_detail_denied \gset
          \if :runs_exists
          \else
            \quit 1
          \endif
          \if :index_exists
          \else
            \quit 1
          \endif
          \if :detail_exists
          \else
            \quit 1
          \endif
          \if :runs_rls
          \else
            \quit 1
          \endif
          \if :index_rls
          \else
            \quit 1
          \endif
          \if :detail_rls
          \else
            \quit 1
          \endif
          \if :version_identity_exists
          \else
            \quit 1
          \endif
          \if :anon_detail_denied
          \else
            \quit 1
          \endif
          \if :auth_detail_denied
          \else
            \quit 1
          \endif
          \if :service_detail_denied
          \else
            \quit 1
          \endif
          SQL
      - name: Verify isolated deployment contract
        run: |
          grep -q 'icecat)' deploy/worker-entrypoint.sh
          grep -q 'icecat-detail)' deploy/worker-entrypoint.sh
          grep -q 'BLS_WORKER_ROLE=icecat' docs/OPEN_ICECAT_INGESTION_WORKER.md
          grep -q 'BLS_WORKER_ROLE=icecat-detail' docs/OPEN_ICECAT_DETAIL_ENRICHMENT_WORKER.md
          grep -q 'ICECAT_API_TOKEN=' deploy/worker.env.example
          grep -q 'ICECAT_CONTENT_TOKEN=' deploy/worker.env.example
          grep -q 'full_reconciliation' workers/open-icecat-worker.ts
          grep -q 'OPEN_ICECAT_DETAIL_PROCESSING_VERSION' workers/open-icecat-detail-worker.ts
