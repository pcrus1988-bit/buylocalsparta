name: Catalogue Typecheck Diagnostic

on:
  pull_request:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Capture focused typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck scripts/customer-security-support-integration-smoke.ts > focused-typecheck.log 2>&1
          echo $? > focused-typecheck.exit
      - name: Capture core tests
        shell: bash
        run: |
          set +e
          npm run test:core > core-tests.log 2>&1
          echo $? > core-tests.exit
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-typecheck-diagnostic
          path: |
            focused-typecheck.log
            focused-typecheck.exit
            core-tests.log
            core-tests.exit
