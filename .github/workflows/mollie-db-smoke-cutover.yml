name: Mollie returns acceptance cutover

on:
  push:
    branches:
      - migration/mollie-payments-v2
    paths:
      - .github/workflows/mollie-db-smoke-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/mollie-payments-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Convert returns acceptance to Mollie
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/customer-returns-lifecycle-acceptance.ts')
          src = path.read_text()

          if 'import { FakeMollieGateway } from "./fake-mollie-gateway.ts";' not in src:
            src = src.replace(
              'import { randomUUID } from "node:crypto";\n',
              'import { randomUUID } from "node:crypto";\nimport { FakeMollieGateway } from "./fake-mollie-gateway.ts";\n'
            )

          src = src.replace('  PostgresVivaPaymentsService,\n  type VivaPaymentsGateway\n', '  PostgresMolliePaymentsService\n')

          class_start = src.find('class FakeVivaGateway')
          if class_start != -1:
            class_end = src.index('const runtime =', class_start)
            src = src[:class_start] + src[class_end:]

          src = src.replace('const vivaGateway = new FakeVivaGateway();', 'const mollieGateway = new FakeMollieGateway();')
          src = src.replace(
            'const viva = new PostgresVivaPaymentsService(runtime.sqlPool, vivaGateway);',
            'const mollie = new PostgresMolliePaymentsService(runtime.sqlPool, mollieGateway, { publicBaseUrl: "https://kontamou.example.test" });'
          )
          src = src.replace('await viva.initiateOrderPayment', 'await mollie.initiateOrderPayment')
          src = src.replace('vivaGateway.confirm(initiated.orderCode, order.total.minor)', 'mollieGateway.confirm(initiated.paymentId, order.total.minor)')
          src = src.replace(
            'await viva.reconcileTransaction({ transactionId, expectedOrderCode: initiated.orderCode, source: "webhook", now: now + 220 })',
            'await mollie.reconcilePayment({ paymentId: transactionId, source: "webhook", now: now + 220 })'
          )
          src = src.replace('vivaGateway.refundCount', 'mollieGateway.refundCount')
          src = src.replace('viva.executeApprovedReturnRefund', 'mollie.executeApprovedReturnRefund')
          src = src.replace('Viva refund', 'Mollie refund')
          src = src.replace('vivaRefundLinkage', 'mollieRefundLinkage')

          forbidden = [
            'PostgresVivaPaymentsService', 'VivaPaymentsGateway', 'FakeVivaGateway',
            'vivaGateway', 'viva.executeApprovedReturnRefund', 'initiated.orderCode', 'reconcileTransaction',
            'Viva refund', 'vivaRefundLinkage'
          ]
          remaining = [item for item in forbidden if item in src]
          if remaining:
            raise SystemExit(f'Legacy returns payment fragments remain: {remaining}')

          path.write_text(src)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck returns acceptance
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck scripts/customer-returns-lifecycle-acceptance.ts

      - name: Reject Viva in returns acceptance
        run: '! grep -niE "PostgresVivaPaymentsService|VivaPaymentsGateway|FakeVivaGateway|vivaGateway|viva.executeApprovedReturnRefund|Viva refund|vivaRefundLinkage" scripts/customer-returns-lifecycle-acceptance.ts'

      - name: Commit Mollie returns acceptance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/customer-returns-lifecycle-acceptance.ts
          git commit -m 'Replace Viva return refunds with Mollie acceptance coverage'
          git push origin HEAD:migration/mollie-payments-v2
