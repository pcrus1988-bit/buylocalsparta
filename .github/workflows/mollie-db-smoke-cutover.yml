name: Mollie DB smoke cutover

on:
  push:
    branches:
      - migration/mollie-payments-v2
    paths:
      - .github/workflows/mollie-db-smoke-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/mollie-payments-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Convert DB smoke to Mollie runtime semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/db-integration-smoke.ts')
          src = path.read_text()
          if 'import { FakeMollieGateway } from "./fake-mollie-gateway.ts";' not in src:
            src = src.replace('import { randomUUID } from "node:crypto";\n', 'import { randomUUID } from "node:crypto";\nimport { FakeMollieGateway } from "./fake-mollie-gateway.ts";\n')
          src = src.replace('  PostgresVivaPaymentsService,', '  PostgresMolliePaymentsService,')
          src = src.replace('  type VivaPaymentsGateway\n', '')

          start = src.find('class FakeVivaGateway')
          if start != -1:
            end = src.index('class FakeMeilisearch', start)
            src = src[:start] + src[end:]

          src = src.replace('Viva', 'Mollie').replace('viva', 'mollie')
          src = src.replace('new PostgresMolliePaymentsService(runtime.sqlPool, mollieGateway, { emailNotificationsEnabled:true })', 'new PostgresMolliePaymentsService(runtime.sqlPool, mollieGateway, { publicBaseUrl:"https://kontamou.example.test", emailNotificationsEnabled:true })')
          src = src.replace('new PostgresMolliePaymentsService(runtimeB.sqlPool, mollieGateway, { emailNotificationsEnabled:true })', 'new PostgresMolliePaymentsService(runtimeB.sqlPool, mollieGateway, { publicBaseUrl:"https://kontamou.example.test", emailNotificationsEnabled:true })')
          src = src.replace('mollieInitiatedA.orderCode', 'mollieInitiatedA.paymentId')
          src = src.replace('mollieInitiatedB.orderCode', 'mollieInitiatedB.paymentId')
          src = src.replace('lateCaptureInitiated.orderCode', 'lateCaptureInitiated.paymentId')
          src = src.replace('lastRefundTransactionId', 'lastRefundId')

          src = src.replace(
            'const mollieConfirmed = await mollieB.reconcileTransaction({ transactionId:mollieTransactionId, expectedOrderCode:mollieInitiatedA.paymentId, source:"webhook", now:now+3_180 });',
            'const mollieConfirmed = await mollieB.reconcilePayment({ paymentId:mollieTransactionId, source:"webhook", now:now+3_180 });'
          )
          src = re.sub(
            r'  const refundTx=mollieGateway\.lastRefundId;\n  await mollieB\.handleWebhook\([^\n]+\);',
            '  await mollieB.reconcilePayment({ paymentId:mollieInitiatedA.paymentId, source:"webhook", now:now+3_230 });',
            src,
            count=1
          )
          src = src.replace(
            'await mollieA.reconcileTransaction({transactionId:mollieTransactionId,expectedOrderCode:mollieInitiatedA.paymentId,source:"webhook",now:now+3_240});',
            'await mollieA.reconcilePayment({paymentId:mollieTransactionId,source:"webhook",now:now+3_240});'
          )
          src = src.replace(
            'const lateCaptureReconciled = await mollieB.reconcileTransaction({ transactionId:lateCaptureTransactionId, expectedOrderCode:lateCaptureInitiated.paymentId, source:"webhook", now:now+3_290 });',
            'const lateCaptureReconciled = await mollieB.reconcilePayment({ paymentId:lateCaptureTransactionId, source:"webhook", now:now+3_290 });'
          )
          src = src.replace(
            'await mollieA.reconcileTransaction({ transactionId:lateCaptureTransactionId, expectedOrderCode:lateCaptureInitiated.paymentId, source:"webhook", now:now+3_300 });',
            'await mollieA.reconcilePayment({ paymentId:lateCaptureTransactionId, source:"webhook", now:now+3_300 });'
          )

          src = src.replace('mollieCrossInstancePaymentOrder', 'mollieCrossInstancePayment')
          src = src.replace('mollieReversalDeduplication', 'mollieWebhookReconciliationIdempotency')
          src = src.replace('mollieOutOfOrderWebhookMonotonicity', 'mollieCanonicalStateMonotonicity')

          forbidden = ['PostgresVivaPaymentsService','VivaPaymentsGateway','FakeVivaGateway','reconcileTransaction','handleWebhook','Viva','viva']
          remaining = [item for item in forbidden if item in src]
          if remaining:
            raise SystemExit(f'Legacy payment smoke fragments remain: {remaining}')
          path.write_text(src)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck DB smoke
        run: npm run typecheck:db-smoke

      - name: Commit Mollie DB smoke
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/db-integration-smoke.ts scripts/fake-mollie-gateway.ts
          git commit -m 'Replace Viva DB smoke with Mollie scenarios'
          git push origin HEAD:migration/mollie-payments-v2
