name: Admin HUB Vendor Plan Preview Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/app/admin/hubs/plan-preview/**"
      - "apps/web/src/app/admin/applications/page.tsx"
      - "apps/web/src/app/admin/partners/[id]/page.tsx"
      - "apps/web/src/app/vendor/claim/page.tsx"
      - "apps/web/src/components/HubClaimProfileEditor.tsx"
      - "apps/web/src/components/VendorDashboardTools.tsx"
      - "scripts/verify-admin-hub-plan-preview.ts"
      - ".github/workflows/admin-hub-plan-preview-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/admin/hubs/plan-preview/**"
      - "apps/web/src/app/vendor/claim/page.tsx"
      - "apps/web/src/components/HubClaimProfileEditor.tsx"
      - "apps/web/src/components/VendorDashboardTools.tsx"
      - "scripts/verify-admin-hub-plan-preview.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify plan preview security and rendering contracts
        run: node --experimental-strip-types scripts/verify-admin-hub-plan-preview.ts
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck web application
        run: npx tsc --noEmit -p apps/web/tsconfig.json
