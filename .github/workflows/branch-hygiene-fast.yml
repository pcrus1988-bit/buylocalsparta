name: Branch hygiene final cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-hygiene-fast.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove final incorporated hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: hotfix/enable-aade-reconciliation-cron
        shell: bash
        run: |
          set -euo pipefail

          if ! gh api "/repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH is already absent."
            exit 0
          fi

          echo "Branch is fully incorporated into main and is not part of the retained keep-set."
          gh api --method DELETE "/repos/$REPO/git/refs/heads/$BRANCH"
          echo "Deleted $BRANCH"
