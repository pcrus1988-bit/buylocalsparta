name: Fiscal Foundation CI
on:
  pull_request:
    paths:
      - "apps/web/src/app/timologio/**"
      - "apps/web/src/app/timologio-admin/**"
      - "apps/web/src/lib/fiscal-*.ts"
      - "apps/web/next.config.ts"
      - "apps/web/src/app/admin/fiscal-access/**"
      - "apps/web/src/components/Fiscal*.tsx"
      - "fiscal/**"
      - "scripts/fiscal-*.mjs"
      - ".github/workflows/fiscal-foundation-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/timologio/**"
      - "apps/web/src/app/timologio-admin/**"
      - "apps/web/src/lib/fiscal-*.ts"
      - "apps/web/next.config.ts"
      - "apps/web/src/app/admin/fiscal-access/**"
      - "apps/web/src/components/Fiscal*.tsx"
      - "fiscal/**"
      - "scripts/fiscal-*.mjs"
jobs:
  fiscal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fiscal_ci
          POSTGRES_PASSWORD: ci-only-secret
          POSTGRES_DB: fiscal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fiscal_ci -d fiscal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      FISCAL_DATABASE_URL: postgresql://fiscal_ci:ci-only-secret@localhost:5432/fiscal_ci
      DATABASE_URL: postgresql://fiscal_ci:ci-only-secret@localhost:5432/marketplace_ci
      FISCAL_REGISTRATION_ENABLED: "false"
      FISCAL_STANDALONE_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Inspect production dependency advisories (review gate)
        run: node scripts/fiscal-security-audit.mjs
      - name: Create separate marketplace database for isolation validation
        run: psql "$FISCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE marketplace_ci"
      - name: Check M48 fail-closed migration preflight pure regressions
        run: node --test scripts/fiscal-migration-preflight.test.mjs
      - name: Migrate only the dedicated fiscal database
        run: node scripts/fiscal-migrate.mjs
      - name: Verify M46 read-only migration planning, drift and database isolation
        run: node --test scripts/fiscal-migration-readiness.test.mjs
      - name: Verify independent FISCAL schema matches all checked-in migration checksums
        run: node scripts/fiscal-migration-readiness.mjs --require-current
      - name: Check M48 dual-ledger drift refusal in disposable PostgreSQL
        env:
          CI: "true"
        run: node scripts/fiscal-migration-preflight-db-smoke.mjs
      - name: Verify M47 synthetic-only restore-target protection
        run: node --test scripts/fiscal-disposable-restore-drill.test.mjs
      - name: Verify M47 PG17 custom backup restores data, schema and RLS into separate disposable database
        env:
          CI: "true"
          FISCAL_RESTORE_DRILL_MODE: "synthetic"
        run: node scripts/fiscal-disposable-restore-drill.mjs
      - name: Verify schema and forbidden fiscal transitions
        run: node scripts/fiscal-db-smoke.mjs
      - name: Verify merchant KYB ownership and tenant isolation in disposable DB
        env:
          CI: "true"
        run: node --experimental-strip-types scripts/fiscal-merchant-kyb-db-smoke.mjs
      - name: Verify isolated dual-approval recovery constraints
        env:
          CI: "true"
        run: node scripts/fiscal-mfa-recovery-db-smoke.mjs
      - name: Verify security outbox RLS and provider acceptance transitions
        env:
          CI: "true"
        run: node scripts/fiscal-security-alert-db-smoke.mjs
      - name: Check bounded, idempotent recovery alert retry rules
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-security-alert-delivery-policy.test.ts
      - name: Verify bounded provider status reconciliation and strict email ownership
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-security-alert-provider-status.test.ts
      - name: Check recovery request and approval input validation
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-mfa-recovery-input.test.ts
      - name: Refuse migration against marketplace database
        run: |
          if FISCAL_DATABASE_URL="$DATABASE_URL" node scripts/fiscal-migrate.mjs; then
            echo "Isolation test failed: marketplace database was accepted"; exit 1
          fi
      - name: Verify integer-only non-fiscal line calculations
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-preview-calculator.test.ts
      - name: Verify browser Origin policy for super-admin form handoff
        run: node --test scripts/fiscal-sso-origin-policy.test.mjs
      - name: Verify operator KYB queue priorities and redacted SQL
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-review-queue.test.ts
      - name: Verify local-only evidence preparation and fail-closed storage contract
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-evidence-preparation.test.ts
      - name: Verify M31 sensitive evidence intake remains locked and isolated
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-intake-security.test.ts
      - name: Verify M32 in-memory quarantine encryption and non-release invariants
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-core.test.ts
      - name: Verify M33 signed quarantine attestations and bounded audit contracts
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-evidence-contract.test.ts
      - name: Verify M34 read-only vault readiness and zero authorization invariants
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-live-readiness.test.ts
      - name: Verify M35 synthetic encrypted vault rehearsal never touches real storage
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-synthetic-rehearsal.test.ts
      - name: Verify M36 Storage role boundary and service-role bypass warning
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-access-boundary.test.ts
      - name: Verify M37 synthetic HTTP Storage API contract and cleanup failures
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-storage-api-probe.test.ts
      - name: Verify M43 pinned live OIDC/JWKS compatibility and SSRF-negative gates
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-oidc-readiness.test.ts
      - name: Verify M42 single-use synthetic dispatch and fail-closed signature gate
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-replay-barrier.test.ts
      - name: Verify M42 atomic PostgreSQL replay ledger with concurrent sessions and denial roles
        env:
          CI: "true"
        run: node scripts/fiscal-vault-replay-db-smoke.mjs
      - name: Verify M41 offline KMS signing contract and forged/incorrect-key refusals
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-kms-signer-rehearsal.test.ts
      - name: Verify M40 pinned RSA-signed synthetic-only probe gate and no-network denials
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-signed-probe.test.ts
      - name: Verify M38 dormant Storage role metadata never grants access
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-vault-dormant-role-readiness.test.ts
      - name: Verify exact M38 dormant role SQL with real RLS denies in disposable PostgreSQL
        env:
          CI: "true"
        run: node --experimental-strip-types scripts/fiscal-vault-dormant-role-db-smoke.mjs
      - name: Verify M39 scoped Storage policy blueprint with run and role isolation
        env:
          CI: "true"
        run: node scripts/fiscal-vault-synthetic-rls-db-smoke.mjs
      - name: Verify M36 real PostgreSQL RLS denials with synthetic rows only
        env:
          CI: "true"
        run: node scripts/fiscal-vault-access-boundary-db-smoke.mjs
      - name: Verify M34 exact storage catalog SQL on disposable PostgreSQL
        env:
          CI: "true"
        run: node --experimental-strip-types scripts/fiscal-vault-readiness-db-smoke.mjs
      - name: Verify M45 real 30-day tenant-scoped merchant draft analytics
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-draft-activity.test.ts
      - name: Verify M44 real draft CSV output limits, auth contract and spreadsheet injection defense
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-draft-export.test.ts
      - name: Verify merchant KYB progress never exposes records or grants approval
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-merchant-kyb-progress.test.ts
      - name: Verify strictly bounded KYB evidence checklist and non-approval states
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-kyb-checks.test.ts
      - name: Verify RFC6238 FISCAL operator MFA and AES-GCM sealing
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-operator-mfa-crypto.test.ts
      - name: Verify bounded FISCAL KYB admin review contract
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-admin-review.test.ts
      - name: Verify signed FISCAL super-admin SSO tickets
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-superadmin-tickets.test.ts
      - name: Verify independent FISCAL routing policy
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-service-routing.test.ts
      - name: Verify strictly balanced sandbox accounting entries
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-sandbox-journal.test.ts
      - name: Verify bounded non-fiscal trial balance arithmetic
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-sandbox-trial-balance.test.ts
      - name: Verify strict non-fiscal credit/refund allocation limits
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-sandbox-credit-allocation.test.ts
      - name: Verify M48 live, read-only release-blocker classification
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-live-migration-readiness.test.ts
      - name: Verify operator release diagnostics are read-only and fail closed
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-release-gates.test.ts
      - name: Verify merchant onboarding and legal-issuance fail-closed summaries
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-merchant-readiness.test.ts
      - name: Verify synthetic credit lab parsing and allocation guardrails
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-credit-lab.test.ts
      - name: Verify non-fiscal draft data integrity reviews
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-draft-preflight.test.ts
      - name: Verify safe PostgreSQL endpoint diagnostics
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-connection-diagnostics.test.ts
      - name: Verify Supabase CA fingerprint and TLS hostname checks
        run: node --experimental-strip-types --test apps/web/src/lib/fiscal-pg-connection.test.ts
      - name: Typecheck shared Fiscal route source
        run: npm --workspace @buy-local-sparta/web exec tsc -- --noEmit --incremental false
      - name: Validate standalone Fiscal route tree
        run: node scripts/fiscal-route-isolation.mjs
      - name: Fiscal standalone environment preflight
        env:
          DATABASE_URL: ""
          POSTGRES_URL: ""
        run: node scripts/fiscal-deployment-preflight.mjs --staging
      - name: Build standalone Fiscal app, without marketplace runtime credentials
        working-directory: fiscal/service
        env:
          DATABASE_URL: ""
          POSTGRES_URL: ""
        run: ../../node_modules/.bin/next build
      - name: Live standalone HTTP acceptance against disposable Fiscal PostgreSQL
        env:
          CI: "true"
          FISCAL_STANDALONE_MODE: "true"
          FISCAL_REGISTRATION_ENABLED: "false"
          FISCAL_ISSUANCE_ENABLED: "false"
        run: node scripts/fiscal-http-e2e.mjs
