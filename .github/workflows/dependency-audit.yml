name: Dependency Audit Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install current dependency graph
        run: npm install --ignore-scripts
      - name: Capture exact npm audit report
        run: npm audit --json || true
      - name: Capture installed dependency tree
        run: npm ls --all || true
      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated lockfile to audit branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already matches the tested graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock tested dependency graph"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
