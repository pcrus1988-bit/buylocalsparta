name: DrinkStock commercial foundation
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/drinkstock-*.ts'
      - 'apps/web/test/drinkstock-*.ts'
      - 'db/operations/*drinkstock*.sql'
      - 'db/migrations/*drinkstock*.sql'
      - 'package.json'
      - '.github/workflows/drinkstock-commercial-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/drinkstock-*.ts'
      - 'apps/web/test/drinkstock-*.ts'
      - 'db/operations/*drinkstock*.sql'
      - '.github/workflows/drinkstock-commercial-foundation.yml'
permissions:
  contents: read
jobs:
  commercial-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: drinkstock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:drinkstock-commercial
      - run: npm run test:drinkstock-commercial:postgres
        env:
          DRINKSTOCK_TEST_DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:5432/drinkstock_test
