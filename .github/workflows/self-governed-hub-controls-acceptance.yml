name: SELF_GOVERNED HUB Controls Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/app/vendor/hub/**"
      - "apps/web/src/app/api/vendor/hub/**"
      - "apps/web/src/components/VendorHubControlsClient.tsx"
      - "apps/web/src/lib/vendor-hub-controls-service.ts"
      - "apps/web/src/lib/workspace-navigation.ts"
      - "apps/web/next.config.ts"
      - "packages/core/src/vendor/operating-context.ts"
      - "packages/core/src/persistence/sql.ts"
      - "packages/postgres-runtime/src/vendor-auth.ts"
      - "packages/postgres-runtime/src/boxnow-shipping.ts"
      - "apps/web/src/lib/vendor-runtime.ts"
      - "packages/postgres-runtime/src/index.ts"
      - "db/migrations/0291_self_governed_hub_vendor_controls.sql"
      - "db/migrations/0292_self_governed_hub_vendor_controls_advisor_hardening.sql"
      - "db/migrations/0293_self_governed_hub_scope_helpers.sql"
      - "db/migrations/checksums.0291.json"
      - "db/migrations/checksums.0292.json"
      - "db/migrations/checksums.0293.json"
      - "scripts/verify-self-governed-hub-controls.ts"
      - "scripts/hub-non-sparta-runtime-acceptance.ts"
      - ".github/workflows/self-governed-hub-controls-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/vendor/hub/**"
      - "apps/web/src/app/api/vendor/hub/**"
      - "apps/web/src/components/VendorHubControlsClient.tsx"
      - "apps/web/src/lib/vendor-hub-controls-service.ts"
      - "apps/web/src/lib/workspace-navigation.ts"
      - "apps/web/next.config.ts"
      - "packages/core/src/vendor/operating-context.ts"
      - "packages/core/src/persistence/sql.ts"
      - "packages/postgres-runtime/src/vendor-auth.ts"
      - "packages/postgres-runtime/src/boxnow-shipping.ts"
      - "apps/web/src/lib/vendor-runtime.ts"
      - "packages/postgres-runtime/src/index.ts"
      - "db/migrations/0291_self_governed_hub_vendor_controls.sql"
      - "db/migrations/0292_self_governed_hub_vendor_controls_advisor_hardening.sql"
      - "db/migrations/0293_self_governed_hub_scope_helpers.sql"
      - "db/migrations/checksums.0291.json"
      - "db/migrations/checksums.0292.json"
      - "db/migrations/checksums.0293.json"
      - "scripts/verify-self-governed-hub-controls.ts"
      - "scripts/hub-non-sparta-runtime-acceptance.ts"
      - ".github/workflows/self-governed-hub-controls-acceptance.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify SELF_GOVERNED HUB control boundaries
        run: node --experimental-strip-types scripts/verify-self-governed-hub-controls.ts

  runtime-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: buy_local_sparta
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: buy_local_sparta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buy_local_sparta -d buy_local_sparta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buy_local_sparta:ci-password@127.0.0.1:5432/buy_local_sparta
      BLS_AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BLS_ENABLE_DEMO_ACCOUNTS: "false"
      BLS_ACCEPTANCE_SYNTHETIC_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap Supabase-compatible role and Vault topology
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text UNIQUE,
            description text,
            secret text NOT NULL,
            key_id uuid,
            nonce bytea,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE VIEW vault.decrypted_secrets AS
            SELECT id, name, description, secret, secret AS decrypted_secret,
                   key_id, nonce, created_at, updated_at
            FROM vault.secrets;
          CREATE OR REPLACE FUNCTION vault.create_secret(
            new_secret text,
            new_name text,
            new_description text,
            new_key_id uuid
          ) RETURNS uuid
          LANGUAGE plpgsql
          AS $$
          DECLARE
            created_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO vault.secrets(id, secret, name, description, key_id)
            VALUES(created_id, new_secret, new_name, new_description, new_key_id);
            RETURN created_id;
          END;
          $$;
          SQL
      - name: Apply full PostgreSQL/PostGIS migration chain
        run: npm run db:migrate
      - name: Bind acceptance platform runtime credential
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT bls_platform_runtime TO buy_local_sparta"
      - name: Verify database readiness
        run: npm run db:ready
      - name: Exercise non-Sparta and Sparta HUB database scopes
        run: >-
          node --experimental-strip-types --loader ./scripts/resolve-typescript-extension.mjs
          scripts/hub-non-sparta-runtime-acceptance.ts
