name: PosoKanei Reference Evaluation
on:
  pull_request:
    paths:
      - 'scripts/posokanei/**'
      - 'docs/posokanei-feature-spec.md'
      - '.github/workflows/posokanei-reference-evaluation.yml'
  push:
    paths:
      - 'scripts/posokanei/**'
      - 'docs/posokanei-feature-spec.md'
      - '.github/workflows/posokanei-reference-evaluation.yml'
permissions:
  contents: read
jobs:
  offline-adapter-and-comparison:
    name: Offline adapter and price comparison tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test reference importer and comparison engine
        run: node --test scripts/posokanei/*.test.mjs
      - name: Privately audit latest full public snapshot
        run: node scripts/posokanei/import-snapshot.mjs --latest --out "$RUNNER_TEMP/posokanei"
      - name: Audit full-catalogue cheaper-brand matching coverage
        run: node scripts/posokanei/brand-coverage-audit.mjs "$RUNNER_TEMP/posokanei"
      - name: Rank unverified comparable families for manual review
        run: |
          node scripts/posokanei/build-comparable-review-queue.mjs "$RUNNER_TEMP/posokanei" --out "$RUNNER_TEMP/posokanei/candidate-queue.json" --limit 100
          # The full evidence queue is a local runner file, never a public artifact.
      - name: Report non-identifying import counts
        run: |
          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/posokanei/manifest.json","utf8"));console.log(JSON.stringify({date:m.snapshot_date,total:m.source_total,collected:m.source_collected,prices:m.reference_price_observations,checksum:m.snapshot_sha256,warnings:m.warnings}));'
