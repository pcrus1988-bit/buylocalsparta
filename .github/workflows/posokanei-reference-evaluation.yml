name: PosoKanei Reference Evaluation
on:
  pull_request:
    paths:
      - 'scripts/posokanei/**'
      - 'docs/posokanei-feature-spec.md'
      - '.github/workflows/posokanei-reference-evaluation.yml'
  push:
    paths:
      - 'scripts/posokanei/**'
      - 'docs/posokanei-feature-spec.md'
      - '.github/workflows/posokanei-reference-evaluation.yml'
permissions:
  contents: read
jobs:
  offline-adapter-and-comparison:
    name: Offline adapter and price comparison tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test reference importer and comparison engine
        run: node --test scripts/posokanei/*.test.mjs
