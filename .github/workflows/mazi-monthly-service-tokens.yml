name: MAZI Monthly Service Tokens

on:
  pull_request:
    paths:
      - 'mazi-app/**'
      - '.github/workflows/mazi-monthly-service-tokens.yml'
  push:
    branches: [main]
    paths:
      - 'mazi-app/**'
      - '.github/workflows/mazi-monthly-service-tokens.yml'

permissions:
  contents: read

jobs:
  token-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: node --version
      - name: Verify allowance, permissions, idempotency and catalogue contract
        run: node --test mazi-app/tests/service-tokens-contract.test.mjs
