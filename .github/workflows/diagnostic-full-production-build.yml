name: Diagnostic Full Production Build
on:
  push:
    branches:
      - diagnose/prod-build-after-schema-20260929

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: production
      VERCEL_TARGET_ENV: production
      MOLLIE_PAYMENTS_ENABLED: "true"
      MOLLIE_API_KEY: live_diagnostic_only
      MOLLIE_PUBLIC_BASE_URL: https://kontamou.site
      BLS_PRODUCTION_SCHEMA_STATUS_ORIGIN: https://kontamou.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build web in production mode
        run: npm run build
