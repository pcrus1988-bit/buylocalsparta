name: Branch hygiene

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-merged-pr-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branch when no open PR depends on it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BRANCH" in
            main|feature/dropship-supplier-engine-v1|recovery/resend-inbound-20260909)
              echo "Keeping explicit long-running branch: $BRANCH"
              exit 0
              ;;
          esac

          if gh api --paginate "/repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | .head.ref, .base.ref' | grep -Fxq "$BRANCH"; then
            echo "Keeping $BRANCH because another open PR still references it."
            exit 0
          fi

          if ! gh api "/repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH is already absent."
            exit 0
          fi

          gh api --method DELETE "/repos/$REPO/git/refs/heads/$BRANCH"
          echo "Deleted merged PR branch: $BRANCH"
