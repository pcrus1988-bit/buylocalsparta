name: Branch hygiene

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup-existing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u

          open_refs="$RUNNER_TEMP/open-pr-refs.txt"
          explicit_keep="$RUNNER_TEMP/explicit-keep.txt"
          failures="$RUNNER_TEMP/delete-failures.txt"
          : > "$failures"

          gh api --paginate "/repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | .head.ref, .base.ref' | sort -u > "$open_refs"

          cat > "$explicit_keep" <<'EOF'
          main
          feature/dropship-supplier-engine-v1
          recovery/resend-inbound-20260909
          EOF

          kept=0
          deleted=0
          failed=0

          is_kept() {
            local branch="$1"
            grep -Fxq "$branch" "$open_refs" || grep -Fxq "$branch" "$explicit_keep"
          }

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if is_kept "$branch"; then
              echo "KEEP   $branch"
              kept=$((kept + 1))
              continue
            fi

            echo "DELETE $branch"
            if gh api --method DELETE "/repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "$branch" >> "$failures"
              failed=$((failed + 1))
            fi
          done < <(gh api --paginate "/repos/$REPO/branches?per_page=100" --jq '.[].name')

          {
            echo "## Branch cleanup"
            echo
            echo "- Kept: $kept"
            echo "- Deleted: $deleted"
            echo "- Failed: $failed"
            echo
            echo "### Explicit long-running branches retained"
            echo '- `feature/dropship-supplier-engine-v1`'
            echo '- `recovery/resend-inbound-20260909`'
            echo
            echo "All branches referenced as a head or base by an open PR were retained automatically."
            if [ "$failed" -gt 0 ]; then
              echo
              echo "### Deletion failures"
              sed 's/^/- `/' "$failures" | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "Some branches could not be deleted; see job summary." >&2
            exit 1
          fi

  delete-merged-pr-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branch when no open PR depends on it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BRANCH" in
            main|feature/dropship-supplier-engine-v1|recovery/resend-inbound-20260909)
              echo "Keeping explicit long-running branch: $BRANCH"
              exit 0
              ;;
          esac

          if gh api --paginate "/repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | .head.ref, .base.ref' | grep -Fxq "$BRANCH"; then
            echo "Keeping $BRANCH because another open PR still references it."
            exit 0
          fi

          if ! gh api "/repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH is already absent."
            exit 0
          fi

          gh api --method DELETE "/repos/$REPO/git/refs/heads/$BRANCH"
          echo "Deleted merged PR branch: $BRANCH"
