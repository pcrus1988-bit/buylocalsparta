name: One-shot premium category link fix

on:
  push:
    branches: [feat/premium-marketplace-experience]
    paths:
      - ".github/workflows/one-shot-premium-category-links.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-marketplace-experience
          fetch-depth: 1
      - name: Preserve direct homepage links to every available category
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/app/page.tsx")
          source = path.read_text()
          old = "visibleCategories.slice(0, 8).map"
          new = "visibleCategories.map"
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one {old!r}, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit surgical fix
        run: |
          git config user.name "KONTA MOY Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-premium-category-links.yml
          git add apps/web/src/app/page.tsx
          git commit -m "fix(seo): preserve direct links to every available category"
          git push origin HEAD:feat/premium-marketplace-experience
