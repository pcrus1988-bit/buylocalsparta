name: Diagnostic Production Schema Ledger
on:
  push:
    branches:
      - fix/reconcile-production-schema-291-293-20260929

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: production
      BLS_PRODUCTION_SCHEMA_STATUS_ORIGIN: https://kontamou.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify local migration manifest
        run: node --experimental-strip-types scripts/verify-migrations.ts
      - name: Verify production schema fingerprint
        run: node --experimental-strip-types scripts/verify-production-schema-head.ts --vercel-production-only
