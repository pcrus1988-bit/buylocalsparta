name: NYXI Source Collector

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyxi-source-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check NYXI source collector secrets
        id: preflight
        env:
          NYXI_DATABASE_URL: ${{ secrets.NYXI_DATABASE_URL || secrets.MEDIA_DATABASE_URL }}
          NYXI_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.NYXI_OBJECT_STORAGE_ACCESS_KEY_ID || secrets.MEDIA_OBJECT_STORAGE_ACCESS_KEY_ID }}
          NYXI_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NYXI_OBJECT_STORAGE_SECRET_ACCESS_KEY || secrets.MEDIA_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$NYXI_DATABASE_URL" ] || [ -z "$NYXI_OBJECT_STORAGE_ACCESS_KEY_ID" ] || [ -z "$NYXI_OBJECT_STORAGE_SECRET_ACCESS_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NYXI source collection is not activated until database and private object-storage secrets are configured."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node 24
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: npm ci --ignore-scripts

      - name: Sync curated NYXI source registry
        if: steps.preflight.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.NYXI_DATABASE_URL || secrets.MEDIA_DATABASE_URL }}
        run: npm run nyxi:sources:sync

      - name: Drain due NYXI sources
        if: steps.preflight.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.NYXI_DATABASE_URL || secrets.MEDIA_DATABASE_URL }}
          BLS_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.NYXI_OBJECT_STORAGE_ACCESS_KEY_ID || secrets.MEDIA_OBJECT_STORAGE_ACCESS_KEY_ID }}
          BLS_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NYXI_OBJECT_STORAGE_SECRET_ACCESS_KEY || secrets.MEDIA_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          BLS_OBJECT_STORAGE_BUCKET: buy-local-sparta-private
          BLS_OBJECT_STORAGE_REGION: us-east-1
          BLS_OBJECT_STORAGE_ENDPOINT: https://eemihhfreggbigxejjhj.storage.supabase.co/storage/v1/s3
          BLS_OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
          BLS_MEDIA_UPLOAD_TTL_SECONDS: '600'
          BLS_NYXI_SOURCE_MODE: drain
          BLS_NYXI_SOURCE_MAX_ITEMS: '100'
          BLS_NYXI_SOURCE_REQUEST_TIMEOUT_MS: '30000'
          BLS_NYXI_SOURCE_MAX_RESPONSE_BYTES: '26214400'
          BLS_NYXI_SOURCE_DISCOVERY_MAX_LINKS: '2000'
          BLS_NYXI_SOURCE_DISCOVERY_MAX_BYTES: '8388608'
          BLS_NYXI_CANDIDATE_RECHECK_DAYS: '90'
          BLS_NYXI_SOURCE_LEASE_SECONDS: '300'
          BLS_DB_POOL_MAX: '3'
          BLS_NYXI_SOURCE_WORKER_ID: nyxi-gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run worker:nyxi-sources
