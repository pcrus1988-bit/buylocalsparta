name: NOVA catalogue production

on:
  workflow_dispatch:
    inputs:
      full_availability_refresh:
        description: Run the full BrandsGateway availability refresh in this cycle
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nova-catalogue-production.yml"
      - "workers/nova-catalogue-worker.ts"
      - "apps/web/src/lib/nova-*.ts"
      - "apps/web/src/lib/catalogue-enrichment*.ts"
      - "apps/web/src/lib/product-color-profile-runtime.ts"
      - "integrations/dropship-suppliers/**"
      - "packages/postgres-runtime/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: nova-catalogue-production
  cancel-in-progress: false

jobs:
  run-cycle:
    name: BrandsGateway catalogue cycle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NOVA_API_KEY: ${{ secrets.NOVA_API_KEY }}
      PGSSLMODE: require
      BLS_DB_APPLICATION_NAME: github-actions:nova-catalogue
      BLS_DB_CONNECT_TIMEOUT_MS: "15000"
      BLS_DB_POOL_MAX: "2"
      BLS_NOVA_WORKER_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
      BLS_NOVA_RUN_ONCE: "true"
      BLS_NOVA_RUN_AVAILABILITY_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_availability_refresh }}
      BLS_NOVA_AUTO_PRICING_ENABLED: "true"
      BLS_NOVA_AUTO_PUBLICATION_ENABLED: "true"
      BLS_NOVA_CATEGORY_REPAIR_ENABLED: "true"
      BLS_NOVA_MATERIALIZATION_ENABLED: "true"
      BLS_NOVA_MATERIALIZATION_CATCHUP_PASSES: "8"
      BLS_COLOR_PROFILE_BATCH_SIZE: "100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production credentials
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::GitHub Actions secret DATABASE_URL is missing."
            exit 78
          fi
          if [[ -z "${NOVA_API_KEY}" ]]; then
            echo "::error::GitHub Actions secret NOVA_API_KEY is missing."
            exit 78
          fi

      - name: Run one NOVA catalogue cycle
        run: node --experimental-strip-types --loader ./scripts/resolve-typescript-extension.mjs workers/nova-catalogue-worker.ts
