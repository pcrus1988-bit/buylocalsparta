name: Vendor Trial Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/app/api/vendor-application/route.ts"
      - "apps/web/src/app/vendor/trial/**"
      - "apps/web/src/app/vendor/preview/**"
      - "apps/web/src/components/VendorApplicationForm.tsx"
      - "apps/web/src/components/VendorStorefrontBuilder.tsx"
      - "apps/web/src/components/VendorWorkspaceHeader.tsx"
      - "apps/web/src/lib/vendor-application-runtime.ts"
      - "apps/web/src/lib/vendor-session.ts"
      - "apps/web/src/lib/daily-session.ts"
      - "apps/web/src/lib/vendor-trial-runtime.ts"
      - "apps/web/src/lib/vendor-storefront-settings.ts"
      - "packages/postgres-runtime/src/index.ts"
      - "db/migrations/0296_vendor_application_trial.sql"
      - "db/migrations/checksums.0296.json"
      - "scripts/verify-vendor-trial.ts"
      - ".github/workflows/vendor-trial-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/api/vendor-application/route.ts"
      - "apps/web/src/app/vendor/trial/**"
      - "apps/web/src/app/vendor/preview/**"
      - "apps/web/src/components/VendorApplicationForm.tsx"
      - "apps/web/src/components/VendorStorefrontBuilder.tsx"
      - "apps/web/src/components/VendorWorkspaceHeader.tsx"
      - "apps/web/src/lib/vendor-application-runtime.ts"
      - "apps/web/src/lib/vendor-session.ts"
      - "apps/web/src/lib/daily-session.ts"
      - "apps/web/src/lib/vendor-trial-runtime.ts"
      - "apps/web/src/lib/vendor-storefront-settings.ts"
      - "packages/postgres-runtime/src/index.ts"
      - "db/migrations/0296_vendor_application_trial.sql"
      - "db/migrations/checksums.0296.json"
      - "scripts/verify-vendor-trial.ts"
      - ".github/workflows/vendor-trial-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify vendor trial invariants
        run: node --experimental-strip-types scripts/verify-vendor-trial.ts
