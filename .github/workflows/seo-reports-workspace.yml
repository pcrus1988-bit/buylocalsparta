name: SEO Reports Workspace Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/app/admin/seo/reports/**"
      - "apps/web/src/app/api/admin/seo/reports/**"
      - "apps/web/src/components/AdminSeoReportRunner.tsx"
      - "apps/web/src/lib/seo-diagnostic-monitoring.ts"
      - "apps/web/src/lib/seo-diagnostic-reports.ts"
      - "apps/web/src/lib/seo-report-trends.ts"
      - "apps/web/src/lib/seo-unified-report.ts"
      - "apps/web/src/lib/site-navigation.ts"
      - "scripts/verify-seo-reports-workspace.ts"
      - ".github/workflows/seo-reports-workspace.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify SEO reports workspace contracts
        run: node --experimental-strip-types scripts/verify-seo-reports-workspace.ts
