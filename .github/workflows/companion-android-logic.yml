name: Companion Android Logic Acceptance
on:
  pull_request:
    paths:
      - "mobile/**"
      - "apps/web/src/app/api/mobile/companion/**"
      - ".github/workflows/companion-android-logic.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "apps/web/src/app/api/mobile/companion/**"
      - ".github/workflows/companion-android-logic.yml"
jobs:
  matching:
    name: Offline matcher safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --experimental-strip-types --test mobile/test/nearby-matching.test.ts
