name: Catalog migration hashes
on:
  push:
    branches:
      - agent/catalog-matching-live-20260818
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print SHA-256
        run: sha256sum db/migrations/0043_sparta_catalog_taxonomy.sql db/migrations/0044_product_identity_matching.sql