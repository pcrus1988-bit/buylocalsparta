name: SEO Indexed Vendor Claims

on:
  pull_request:
    paths:
      - "apps/web/src/app/vendor/**"
      - "apps/web/src/app/join/apply/**"
      - "apps/web/src/app/api/vendor-application/**"
      - "apps/web/src/components/VendorApplicationForm.tsx"
      - "apps/web/src/lib/seo-public-visibility.ts"
      - "apps/web/src/lib/vendor-application-runtime.ts"
      - "db/migrations/0157_vendor_application_profile_claims.sql"
      - "db/migrations/checksums.0157.json"
      - "scripts/verify-seo-indexed-vendor-claims.ts"
      - ".github/workflows/seo-indexed-vendor-claims.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: buy_local_sparta
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: buy_local_sparta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buy_local_sparta -d buy_local_sparta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buy_local_sparta:ci-password@127.0.0.1:5432/buy_local_sparta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify indexed vendor visibility and claim continuity
        run: node --experimental-strip-types scripts/verify-seo-indexed-vendor-claims.ts
      - name: Verify migration chain and checksums
        run: npm run db:verify
      - name: Bootstrap Supabase-compatible CI roles and Vault surface
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text UNIQUE,
            description text,
            secret text NOT NULL,
            key_id uuid,
            nonce bytea,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE VIEW vault.decrypted_secrets AS
            SELECT id, name, description, secret, secret AS decrypted_secret,
                   key_id, nonce, created_at, updated_at
            FROM vault.secrets;
          CREATE OR REPLACE FUNCTION vault.create_secret(
            new_secret text,
            new_name text,
            new_description text,
            new_key_id uuid
          ) RETURNS uuid
          LANGUAGE plpgsql
          AS $$
          DECLARE
            created_id uuid := gen_random_uuid();
          BEGIN
            INSERT INTO vault.secrets(id, secret, name, description, key_id)
            VALUES(created_id, new_secret, new_name, new_description, new_key_id);
            RETURN created_id;
          END;
          $$;
          SQL
      - name: Apply full PostgreSQL/PostGIS migration chain including 0157
        run: npm run db:migrate
