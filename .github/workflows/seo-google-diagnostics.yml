name: SEO Google Diagnostics

# Production scheduling is owned by Vercel Cron via /api/cron/seo-gsc-diagnostics.
# Keep this workflow only as an optional manual fallback so a missing GitHub
# CRON_SECRET cannot generate false-red scheduled failures.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-google-diagnostics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SEO_GSC_DIAGNOSTICS_URL: https://kontamou.site/api/cron/seo-gsc-diagnostics
    steps:
      - name: Explain unavailable manual fallback
        if: env.CRON_SECRET == ''
        shell: bash
        run: echo "::notice::GitHub CRON_SECRET is not configured; production SEO diagnostics continue through Vercel Cron."

      - name: Refresh Search Console SEO diagnostics
        if: env.CRON_SECRET != ''
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 130 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output /tmp/seo-gsc-diagnostics.json \
            "$SEO_GSC_DIAGNOSTICS_URL"
          cat /tmp/seo-gsc-diagnostics.json
