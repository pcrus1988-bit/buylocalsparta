name: One-shot local delivery custody hotfix

on:
  push:
    branches: [main]
    paths:
      - scripts/one-shot-delivery-hotfix.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply delivery custody and privacy patch
        run: python scripts/one-shot-delivery-hotfix.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck PostgreSQL runtime
        run: npm run typecheck:postgres-runtime

      - name: Verify fulfilment privacy
        run: npm run test:fulfilment-privacy

      - name: Build web
        run: npm run check:web

      - name: Commit hotfix to main
        shell: bash
        run: |
          git config user.name "kontamou-delivery-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/lib/delivery-driver-runtime.ts \
                  packages/postgres-runtime/src/vendor-operations.ts \
                  apps/web/src/lib/vendor-runtime.ts \
                  apps/web/src/lib/order-lifecycle.ts \
                  apps/web/src/components/VendorDailyOrdersClient.tsx \
                  apps/web/src/app/daily/scan/page.tsx \
                  apps/web/src/components/VendorDailyScanner.tsx \
                  apps/web/src/app/api/daily/fulfilments/delivery-contact/route.ts \
                  apps/web/src/app/api/vendor/fulfilments/delivery-contact/route.ts
          git diff --cached --check
          git commit -m "Fix local delivery custody flow and privacy"
          git push origin HEAD:main
