name: Nikolaou catalogue research crawl

on:
  push:
    branches:
      - agent/nikolaou-master-crawl-20260822
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    if: github.head_ref == 'agent/nikolaou-master-crawl-20260822' || github.ref_name == 'agent/nikolaou-master-crawl-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe reader proxy
        shell: bash
        run: |
          set -u
          probe() {
            label="$1"; url="$2"
            echo "=== $label ==="
            curl -L --max-time 45 -sS -o "/tmp/$label.txt" -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' "$url" || true
            head -c 1000 "/tmp/$label.txt" 2>/dev/null || true
            echo
          }
          probe proxy_search 'https://r.jina.ai/http://https://www.nikolaoutools.gr/search/GB6500M'
          probe proxy_direct 'https://r.jina.ai/http://https://www.nikolaoutools.gr/kumatsugen-gb6500m-%CE%B3%CE%B5%CE%BD%CE%BD%CE%AE%CF%84%CF%81%CE%B9%CE%B1-%CE%B2%CE%B5%CE%BD%CE%B6%CE%AF%CE%BD%CE%B7%CF%82-avr-7-5kva-13hp-GB6500M/'
