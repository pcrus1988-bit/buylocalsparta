name: Nikolaou catalogue research crawl

on:
  push:
    branches:
      - agent/nikolaou-master-crawl-20260822
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    if: github.head_ref == 'agent/nikolaou-master-crawl-20260822' || github.ref_name == 'agent/nikolaou-master-crawl-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Crawl Nikolaou catalogue
        run: python scripts/crawl-nikolaou-catalog.py
      - name: Upload crawl artifact
        uses: actions/upload-artifact@v4
        with:
          name: nikolaou-catalog-crawl
          path: artifacts/nikolaou-crawl/
          if-no-files-found: error
          retention-days: 7
