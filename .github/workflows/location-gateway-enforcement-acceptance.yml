name: Location gateway enforcement acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/proxy.ts"
      - "apps/web/src/lib/location-gateway-enforcement.ts"
      - "scripts/verify-location-gateway-enforcement.ts"
      - ".github/workflows/location-gateway-enforcement-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify root-only gateway enforcement
        run: node --experimental-strip-types scripts/verify-location-gateway-enforcement.ts
