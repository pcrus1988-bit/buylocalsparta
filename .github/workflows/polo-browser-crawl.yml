name: POLO full browser crawl

on:
  push:
    branches:
      - chore/polo-catalogue-crawl
    paths:
      - scripts/catalogue/crawl-polo-browser.mjs
      - scripts/catalogue/enrich-polo-browser-v2.mjs
      - .github/workflows/polo-browser-crawl.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polo-full-browser-crawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Crawl complete POLO catalogue
        id: crawl
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/catalogue/crawl-polo-browser.mjs 2>&1 | tee /tmp/polo-full-crawl.log

      - name: Run authoritative POLO enrichment
        id: enrich
        if: steps.crawl.outcome == 'success' && hashFiles('scripts/catalogue/enrich-polo-browser-v2.mjs') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/catalogue/enrich-polo-browser-v2.mjs 2>&1 | tee /tmp/polo-enrichment.log

      - name: Upload POLO import package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polo-full-catalogue-${{ github.run_id }}
          path: |
            data/imports/polo/
            /tmp/polo-full-crawl.log
            /tmp/polo-enrichment.log
          if-no-files-found: warn
          retention-days: 30

      - name: Commit verified crawl output to crawl branch
        if: steps.crawl.outcome == 'success' && (steps.enrich.outcome == 'success' || steps.enrich.outcome == 'skipped')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/polo
          if git diff --cached --quiet; then
            echo 'No POLO dataset changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh full POLO catalogue [skip ci]'
          git push origin HEAD:chore/polo-catalogue-crawl

      - name: Fail workflow if crawl or enrichment failed
        if: steps.crawl.outcome != 'success' || steps.enrich.outcome == 'failure'
        run: exit 1
