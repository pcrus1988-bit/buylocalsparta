name: Google Merchant Production Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-merchant-production-sync.yml"
      - "apps/web/src/lib/google-scheduler-auth.ts"
      - "apps/web/src/app/api/cron/merchant-sync/route.ts"
      - "apps/web/src/app/api/cron/merchant-status/route.ts"
  schedule:
    - cron: "*/10 * * * *"
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-merchant-production-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MERCHANT_SYNC_URL: https://kontamou.site/api/cron/merchant-sync
    steps:
      - name: Sync Google Merchant catalogue
        shell: bash
        run: |
          oidc_token="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fkontamou.site" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 320 \
            --header "Authorization: Bearer ${oidc_token}" \
            --output /tmp/google-merchant-sync.json \
            "$MERCHANT_SYNC_URL"
          cat /tmp/google-merchant-sync.json

  status:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '5,35 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MERCHANT_STATUS_URL: https://kontamou.site/api/cron/merchant-status
    steps:
      - name: Reconcile Google Merchant product status
        shell: bash
        run: |
          oidc_token="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fkontamou.site" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 80 \
            --header "Authorization: Bearer ${oidc_token}" \
            --output /tmp/google-merchant-status.json \
            "$MERCHANT_STATUS_URL"
          cat /tmp/google-merchant-status.json
