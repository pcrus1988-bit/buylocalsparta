name: Flash Sale CI Diagnostic

on:
  push:
    branches:
      - diagnostic/flash-sale-ci-run2

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Capture consistency output
        id: consistency
        shell: bash
        run: |
          set +e
          npm run check:consistency > /tmp/flash-sale-consistency.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic to PR 818
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Flash Sale diagnostic: `npm run check:consistency`'
            echo
            echo '```text'
            tail -c 50000 /tmp/flash-sale-consistency.txt
            echo
            echo '```'
            echo
            echo "Exit status: ${{ steps.consistency.outputs.status }}"
          } > /tmp/comment.md
          gh pr comment 818 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Preserve diagnostic failure state
        if: steps.consistency.outputs.status != '0'
        run: exit 1
