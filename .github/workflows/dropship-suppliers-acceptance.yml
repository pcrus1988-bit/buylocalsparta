name: Dropship Supplier Safety Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'packages/dropship-suppliers/**'
      - 'integrations/dropship-suppliers/**'
      - 'workers/nova-order-reconciliation-worker.ts'
      - 'workers/nova-catalogue-worker.ts'
      - 'workers/symphonya-worker.ts'
      - 'apps/web/src/lib/dropship-order-reconciliation.ts'
      - 'apps/web/src/lib/nova-auto-pricing-runtime.ts'
      - 'apps/web/src/lib/symphonya-*.ts'
      - 'apps/web/src/app/api/cron/symphonya-*/**'
      - 'apps/web/src/lib/nova-availability-refresh-runtime.ts'
      - 'apps/web/src/lib/nova-brandsgateway-pricing.ts'
      - 'apps/web/src/lib/nova-brandsgateway-source-category.ts'
      - 'apps/web/src/lib/nova-catalogue-sync-runtime.ts'
      - 'apps/web/src/lib/nova-catalogue-materializer.ts'
      - 'apps/web/src/lib/nova-sellability-safety.ts'
      - 'apps/web/src/lib/published-dropship-storefront.ts'
      - 'apps/web/src/lib/public-product-variants.ts'
      - 'apps/web/src/lib/public-dropship-presentation.ts'
      - 'apps/web/src/lib/dropship-presentation-policy.ts'
      - 'apps/web/src/app/shop/page.tsx'
      - 'apps/web/test/nova-*.test.ts'
      - 'apps/web/test/symphonya-*.test.ts'
      - 'apps/web/src/lib/shopify-zendrop-bridge.ts'
      - 'apps/web/src/lib/zendrop-shopify-*.ts'
      - 'apps/web/src/lib/dropship-paid-fulfilment.ts'
      - 'apps/web/src/app/api/cron/dropship-order-reconciliation/**'
      - 'apps/web/test/zendrop-*.test.ts'
      - 'db/migrations/0290_zendrop_shopify_bridge_variant_mapping.sql'
      - 'db/migrations/checksums.0290.json'
      - 'packages/postgres-runtime/src/index.ts'
      - 'apps/web/src/lib/shopify-zendrop-bridge.ts'
      - 'apps/web/src/lib/zendrop-shopify-*.ts'
      - 'apps/web/src/lib/dropship-paid-fulfilment.ts'
      - 'apps/web/src/app/api/cron/dropship-order-reconciliation/**'
      - 'apps/web/test/zendrop-*.test.ts'
      - 'db/migrations/0290_zendrop_shopify_bridge_variant_mapping.sql'
      - 'db/migrations/checksums.0290.json'
      - 'packages/postgres-runtime/src/index.ts'
      - 'db/migrations/0221_dropship_supplier_engine.sql'
      - 'db/migrations/0222_dropship_paid_fulfilment_safety.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dropship-suppliers-acceptance.yml'
  pull_request:
    paths:
      - 'packages/dropship-suppliers/**'
      - 'integrations/dropship-suppliers/**'
      - 'workers/nova-order-reconciliation-worker.ts'
      - 'workers/nova-catalogue-worker.ts'
      - 'workers/symphonya-worker.ts'
      - 'apps/web/src/lib/dropship-order-reconciliation.ts'
      - 'apps/web/src/lib/nova-auto-pricing-runtime.ts'
      - 'apps/web/src/lib/symphonya-*.ts'
      - 'apps/web/src/app/api/cron/symphonya-*/**'
      - 'apps/web/src/lib/nova-availability-refresh-runtime.ts'
      - 'apps/web/src/lib/nova-brandsgateway-pricing.ts'
      - 'apps/web/src/lib/nova-brandsgateway-source-category.ts'
      - 'apps/web/src/lib/nova-catalogue-sync-runtime.ts'
      - 'apps/web/src/lib/nova-catalogue-materializer.ts'
      - 'apps/web/src/lib/nova-sellability-safety.ts'
      - 'apps/web/src/lib/published-dropship-storefront.ts'
      - 'apps/web/src/lib/public-product-variants.ts'
      - 'apps/web/src/lib/public-dropship-presentation.ts'
      - 'apps/web/src/lib/dropship-presentation-policy.ts'
      - 'apps/web/src/app/shop/page.tsx'
      - 'apps/web/test/nova-*.test.ts'
      - 'apps/web/test/symphonya-*.test.ts'
      - 'db/migrations/0221_dropship_supplier_engine.sql'
      - 'db/migrations/0222_dropship_paid_fulfilment_safety.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dropship-suppliers-acceptance.yml'

permissions:
  contents: read

jobs:
  supplier-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Test reusable Nova and generic supplier behavior
        run: npm run test:dropship-suppliers
      - name: Typecheck reusable supplier package
        run: npm run typecheck:dropship-suppliers
      - name: Test production paid-fulfilment compatibility boundary
        run: node --experimental-strip-types --test integrations/dropship-suppliers/test/*.test.ts
      - name: Verify governed dropship migration chain
        run: npm run db:verify
      - name: Test Zendrop Shopify bridge runtime contracts
        run: node --experimental-strip-types --loader ./scripts/resolve-typescript-extension.mjs --test apps/web/test/zendrop-*.test.ts
      - name: Test Nova and Symphonya web runtime safety contracts
        run: node --experimental-strip-types --loader ./scripts/resolve-typescript-extension.mjs --test apps/web/test/nova-*.test.ts apps/web/test/symphonya-*.test.ts
      - name: Typecheck production dropship runtime
        run: ./node_modules/.bin/tsc -p integrations/dropship-suppliers/tsconfig.json
