name: SEO Unified Reports Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/app/admin/seo/reports/**"
      - "apps/web/src/app/api/admin/seo/reports/**"
      - "apps/web/src/app/api/admin/seo/search-console/index-coverage/**"
      - "apps/web/src/components/AdminSeoEvidenceRefresh.tsx"
      - "apps/web/src/lib/seo-gsc-index-coverage.ts"
      - "apps/web/src/lib/seo-unified-report.ts"
      - "apps/web/src/lib/site-navigation.ts"
      - "apps/web/src/lib/workspace-navigation.ts"
      - "scripts/verify-seo-unified-reports.ts"
      - ".github/workflows/seo-unified-reports.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify unified SEO report contracts
        run: node --experimental-strip-types scripts/verify-seo-unified-reports.ts
