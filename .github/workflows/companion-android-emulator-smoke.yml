name: Companion Android Emulator Smoke
on:
  pull_request:
    paths:
      - .github/workflows/companion-android-emulator-smoke.yml
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    name: Install APK and launch Android on API 35
    if: github.repository == 'pcrus1988-bit/buylocalsparta' && github.event.pull_request.number == 1553
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install pinned Metro tooling
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Download successful Android debug APK from same repository
        uses: actions/download-artifact@v4
        with:
          name: kontamou-companion-android-debug
          run-id: 38862420570
          repository: pcrus1988-bit/buylocalsparta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/companion-apk
      - name: Boot Android emulator, install and launch Companion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            find /tmp/companion-apk -name '*.apk' -print
            APK=$(find /tmp/companion-apk -name '*.apk' | head -n 1)
            test -n "$APK"
            adb install -r "$APK"
            adb reverse tcp:8081 tcp:8081
            ( cd mobile && CI=1 EXPO_NO_TELEMETRY=1 npx expo start --offline --port 8081 > /tmp/companion-metro.log 2>&1 & )
            sleep 20
            adb shell am start -n site.kontamou.companion/.MainActivity
            sleep 35
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml /tmp/companion-ui.xml || true
            adb shell screencap -p /sdcard/companion-screen.png || true
            adb pull /sdcard/companion-screen.png /tmp/companion-screen.png || true
            adb logcat -d -s ReactNativeJS:E AndroidRuntime:E ReactNative:E > /tmp/companion-error-log.txt || true
            if grep -Ei 'FATAL EXCEPTION|Unable to load script|Invariant Violation|ReactNativeJS:.*Error:|AndroidRuntime:.*FATAL' /tmp/companion-error-log.txt; then
              echo "Android startup/runtime error found"
              exit 1
            fi
            if grep -Eiq 'KONTA MOY|KONTA|Companion|Σπάρτη|Ανακάλυψε|[α-ωάέήίόύώ]' /tmp/companion-ui.xml; then
              echo "Android UI visible"
            else
              echo "Android visible UI not confirmed. Emulator and Metro logs are attached."
              cat /tmp/companion-metro.log | tail -60
              exit 1
            fi
      - name: Upload emulator screenshots and safe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-android-emulator-evidence
          path: |
            /tmp/companion-ui.xml
            /tmp/companion-screen.png
            /tmp/companion-error-log.txt
            /tmp/companion-metro.log
          if-no-files-found: warn
          retention-days: 7
