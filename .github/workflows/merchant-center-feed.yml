name: Merchant Center Feed Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/app/merchant-center/**"
      - "apps/web/src/app/admin/seo/merchant-center/**"
      - "apps/web/src/app/robots.ts"
      - "apps/web/src/lib/catalog-view.ts"
      - "apps/web/src/lib/crawler-catalog.ts"
      - "apps/web/src/lib/merchant-center-catalog.ts"
      - "apps/web/src/lib/merchant-center-feed.ts"
      - "apps/web/src/lib/product-url.ts"
      - "apps/web/src/lib/public-data-integrity.ts"
      - "apps/web/src/lib/seo-entity-policy.ts"
      - "apps/web/src/lib/seo-entity-overrides.ts"
      - "apps/web/src/lib/seo-settings.ts"
      - "apps/web/src/lib/seo-visibility-policy.ts"
      - "apps/web/src/lib/workspace-navigation.ts"
      - "scripts/verify-merchant-center-feed.ts"
      - ".github/workflows/merchant-center-feed.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify Merchant Center feed and Admin readiness contracts
        run: node --experimental-strip-types scripts/verify-merchant-center-feed.ts
      - name: Build public and Admin web app
        run: npm --workspace @buy-local-sparta/web run build
