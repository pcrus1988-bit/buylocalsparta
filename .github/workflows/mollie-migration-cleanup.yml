name: Mollie migration verification

on:
  push:
    branches:
      - migration/mollie-payments-v2
    paths:
      - .github/workflows/mollie-migration-cleanup.yml
      - .env.example
      - apps/web/**
      - packages/**
      - scripts/**
      - workers/**
      - deploy/**
      - db/migrations/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Clean install
        run: npm ci --ignore-scripts

      - name: Reject active Viva payment and fiscal artifacts
        shell: bash
        run: |
          test ! -e packages/viva-payments
          test ! -e packages/postgres-runtime/src/viva-payments.ts
          test ! -e apps/web/src/lib/viva-runtime.ts
          test ! -e apps/web/src/app/api/payments/viva/webhook/route.ts
          ! grep -RniI -E '@buy-local-sparta/viva-payments|VIVA_PAYMENTS_ENABLED|VIVA_CLIENT_ID|VIVA_CLIENT_SECRET|VIVA_MERCHANT_ID|VIVA_API_KEY|VIVA_SOURCE_CODE|BLS_VIVA_FISCAL|viva_fiscal_provider|requireVivaPayments|vivaPaymentsEnabled|PostgresVivaPaymentsService|VivaPaymentsGateway|FakeVivaGateway|typecheck:viva|test:viva|vivaCrossInstance|provider=.viva.|provider=.VIVA.' \
            apps packages scripts workers deploy .env.example package.json package-lock.json \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            --exclude='0031_viva_payments.sql' \
            --exclude='0076_accounting_mapping_v1.sql'
          ! grep -RniI -E 'Viva(\.com)?|Smart Checkout|Mollie OAuth' \
            apps/web/src packages scripts workers deploy \
            --exclude-dir=node_modules \
            --exclude='*.md'

      - name: Verify migration chain
        run: npm run db:verify

      - name: Verify project consistency
        run: npm run check:consistency

      - name: Test Mollie package
        run: |
          test -f packages/mollie-payments/test/mollie-payments.test.ts
          npm run test:mollie

      - name: Type-check Mollie package
        run: npm run typecheck:mollie

      - name: Type-check PostgreSQL runtime
        run: npm run typecheck:postgres-runtime

      - name: Type-check live database smoke
        run: npm run typecheck:db-smoke

      - name: Type-check return refund lifecycle
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --allowImportingTsExtensions --skipLibCheck scripts/customer-returns-lifecycle-acceptance.ts

      - name: Verify return refund composite-key linkage
        shell: bash
        run: |
          grep -F 'UPDATE return_lines SET refund_id=$3 WHERE return_id=$1 AND order_line_id=$2' packages/postgres-runtime/src/mollie-payments.ts
          ! grep -nE 'rl\.id|return_line_uuid|UPDATE return_lines SET refund_id=.*WHERE id=' packages/postgres-runtime/src/mollie-payments.ts

      - name: Verify checkout UX
        run: npm run check:checkout-ux

      - name: Verify private-offer checkout
        run: npm run check:private-offer-checkout

      - name: Verify payment resume
        run: npm run check:payment-resume

      - name: Build web application
        run: npm run build:web
