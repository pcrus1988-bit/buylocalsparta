name: Repair Schema 223 Runtime Head

on:
  push:
    paths:
      - '.github/workflows/repair-schema-223-runtime.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Advance PostgreSQL runtime schema expectation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'export const EXPECTED_SCHEMA_VERSION = 222;' packages/postgres-runtime/src/index.ts
          sed -i 's/export const EXPECTED_SCHEMA_VERSION = 222;/export const EXPECTED_SCHEMA_VERSION = 223;/' packages/postgres-runtime/src/index.ts
          grep -F 'export const EXPECTED_SCHEMA_VERSION = 223;' packages/postgres-runtime/src/index.ts
      - name: Verify project consistency
        run: node --experimental-strip-types scripts/verify-project-consistency.ts
      - name: Commit schema-head repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/postgres-runtime/src/index.ts
          git commit -m 'fix(db): advance PostgreSQL runtime to schema 223'
          git push origin HEAD:main
