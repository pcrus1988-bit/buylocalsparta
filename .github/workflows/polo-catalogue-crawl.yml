name: POLO catalogue crawl

on:
  push:
    branches:
      - chore/polo-catalogue-crawl
    paths:
      - scripts/catalogue/crawl-polo.mjs
      - .github/workflows/polo-catalogue-crawl.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/catalogue/crawl-polo.mjs
      - .github/workflows/polo-catalogue-crawl.yml
      - data/imports/polo/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polo-catalogue-crawl-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout crawl branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl POLO public catalogue
        run: node scripts/catalogue/crawl-polo.mjs

      - name: Upload crawl dataset
        uses: actions/upload-artifact@v4
        with:
          name: polo-catalogue-${{ github.run_id }}
          path: data/imports/polo/
          if-no-files-found: error
          retention-days: 30

      - name: Commit crawl output to branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/polo
          if git diff --cached --quiet; then
            echo "No crawl output changes to commit."
            exit 0
          fi
          git commit -m "data: refresh POLO catalogue crawl [skip ci]"
          git push origin HEAD:chore/polo-catalogue-crawl
