name: POLO catalogue crawl

on:
  push:
    branches:
      - chore/polo-catalogue-crawl
    paths:
      - scripts/catalogue/crawl-polo.mjs
      - scripts/catalogue/crawl-polo-html.mjs
      - .github/workflows/polo-catalogue-crawl.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/catalogue/crawl-polo.mjs
      - scripts/catalogue/crawl-polo-html.mjs
      - .github/workflows/polo-catalogue-crawl.yml
      - data/imports/polo/**
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: polo-catalogue-crawl-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout crawl branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl POLO public catalogue
        id: crawl
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/catalogue/crawl-polo-html.mjs 2>&1 | tee /tmp/polo-crawl.log

      - name: Upload crawl dataset
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: polo-catalogue-${{ github.run_id }}
          path: data/imports/polo/
          if-no-files-found: error
          retention-days: 30

      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polo-crawl-log-${{ github.run_id }}
          path: /tmp/polo-crawl.log
          if-no-files-found: warn
          retention-days: 30

      - name: Report crawl result on PR
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### POLO catalogue crawl — run ${{ github.run_id }}"
            echo
            if [[ "${{ steps.crawl.outcome }}" == "success" && -f data/imports/polo/polo-crawl-summary.json ]]; then
              echo "Crawl completed successfully. Import/QA files were generated in the workflow artifact."
              echo
              echo '```json'
              cat data/imports/polo/polo-crawl-summary.json
              echo '```'
            else
              echo "Crawl outcome: **${{ steps.crawl.outcome }}**"
              echo
              echo '```text'
              tail -n 100 /tmp/polo-crawl.log 2>/dev/null || true
              echo '```'
            fi
          } > /tmp/polo-pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/polo-pr-comment.md

      - name: Commit crawl output to branch
        if: github.event_name == 'push' && steps.crawl.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/polo
          if git diff --cached --quiet; then
            echo "No crawl output changes to commit."
            exit 0
          fi
          git commit -m "data: refresh POLO catalogue crawl [skip ci]"
          git push origin HEAD:chore/polo-catalogue-crawl

      - name: Fail workflow when crawler failed
        if: steps.crawl.outcome != 'success'
        run: exit 1
