name: SEO Structured Data Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/app/admin/seo/schema/**"
      - "apps/web/src/app/admin/seo/issues/**"
      - "apps/web/src/app/api/admin/seo/crawl/**"
      - "apps/web/src/lib/seo-live-crawl.ts"
      - "apps/web/src/lib/seo-schema-policy.ts"
      - "apps/web/src/lib/seo-schema-diagnostics.ts"
      - "apps/web/src/lib/seo-structured-data-history.ts"
      - "apps/web/src/lib/seo-issue-guidance.ts"
      - "apps/web/src/lib/site-navigation.ts"
      - "db/migrations/0122_seo_structured_data_observations.sql"
      - "db/migrations/checksums.json"
      - "packages/postgres-runtime/src/index.ts"
      - "scripts/verify-seo-structured-data.ts"
      - ".github/workflows/seo-structured-data.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify structured-data diagnostics contracts
        run: node --experimental-strip-types scripts/verify-seo-structured-data.ts
      - name: Verify migration manifest
        run: npm run db:verify
