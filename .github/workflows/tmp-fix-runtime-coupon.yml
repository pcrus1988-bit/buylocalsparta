name: Temporary runtime coupon fixture repair

on:
  push:
    branches:
      - fix/current-main-navigation-release-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-main-navigation-release-gate
          fetch-depth: 0
      - name: Remove expired demo coupon end date
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dev/runtime.ts')
          text = path.read_text()
          old = 'startsAt: Date.UTC(2026, 7, 14), endsAt: Date.UTC(2026, 8, 1), maxRedemptions: 500'
          new = 'startsAt: Date.UTC(2026, 7, 14), maxRedemptions: 500'
          count = text.count(old)
          if count == 0:
              print('Fixture already repaired; nothing to commit.')
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f'Expected exactly one coupon fixture match, found {count}')
          path.write_text(text.replace(old, new))
          PY
          if git diff --quiet -- dev/runtime.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/runtime.ts
          git commit -m 'fix(test): keep runtime coupon seed deterministic'
          git push origin HEAD:fix/current-main-navigation-release-gate
