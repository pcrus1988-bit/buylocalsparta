name: Temporary Web Build Diagnostic

on:
  push:
    branches:
      - fix/vendor-xml-storefront-images-20261002-v2

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          BLS_ALLOW_DATABASELESS_PREVIEW: "true"
          BLS_AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnopqrstuvwxyz
