name: Sport Fit WebGL Acceptance

on:
  pull_request:
    paths:
      - "apps/web/src/components/SportFitWebGLUniverse.tsx"
      - "apps/web/src/components/SportFitWebGLUniverse.module.css"
      - "apps/web/src/components/SportFitImmersiveExperience.tsx"
      - "apps/web/src/components/SportFitImmersiveExperience.module.css"
      - "apps/web/src/app/api/sport-fit/**"
      - "apps/web/src/lib/sport-fit-**"
      - "db/migrations/0301_sport_fit_knowledge_layer.sql"
      - "db/migrations/checksums.0301.json"
      - ".github/workflows/sport-fit-webgl-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/src/components/SportFitWebGLUniverse.tsx"
      - "apps/web/src/components/SportFitWebGLUniverse.module.css"
      - "apps/web/src/components/SportFitImmersiveExperience.tsx"
      - "apps/web/src/components/SportFitImmersiveExperience.module.css"
      - "apps/web/src/app/api/sport-fit/**"
      - "apps/web/src/lib/sport-fit-**"
      - "db/migrations/0301_sport_fit_knowledge_layer.sql"
      - "db/migrations/checksums.0301.json"

jobs:
  webgl:
    runs-on: ubuntu-latest
    env:
      BLS_AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BLS_ENABLE_DEMO_ACCOUNTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify Sport & Fit rules
        run: npm run test:sport-fit
      - name: Verify migration checksums
        run: npm run db:verify
      - name: Build Next.js application
        run: npm run check:web
