name: MERIDIO Real Intake Acceptance

on:
  pull_request:
    paths:
      - "products/meridio/**"
      - ".github/workflows/meridio-preview-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "products/meridio/**"
      - ".github/workflows/meridio-preview-acceptance.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate genuine intake module syntax
        run: |
          node --check products/meridio/public/intake/dossier.mjs
          node --check products/meridio/public/intake/intake.mjs
      - name: Test dossier validation, export contract and deleted simulations
        run: node --test products/meridio/test/*.test.mjs
