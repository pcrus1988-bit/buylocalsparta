name: NYXI Agent 1 Provenance Ledger
on:
  pull_request:
    paths:
      - 'scripts/nyxi/governance/attestation-ledger.mjs'
      - 'scripts/nyxi/governance/attestation-ledger.test.mjs'
      - 'scripts/nyxi/governance/witness-checkpoint.mjs'
      - 'scripts/nyxi/governance/witness-checkpoint.test.mjs'
      - 'scripts/nyxi/governance/checkpoint-continuity.mjs'
      - 'scripts/nyxi/governance/checkpoint-continuity.test.mjs'
      - 'scripts/nyxi/governance/private-storage-attestation.mjs'
      - 'scripts/nyxi/governance/private-storage-attestation.test.mjs'
      - 'scripts/nyxi/governance/attestation-batch-plan.mjs'
      - 'scripts/nyxi/governance/attestation-batch-plan.test.mjs'
      - 'scripts/nyxi/governance/documentary-rights-evidence.mjs'
      - 'scripts/nyxi/governance/documentary-rights-evidence.test.mjs'
      - 'scripts/nyxi/governance/rights-review-triage.mjs'
      - 'scripts/nyxi/governance/rights-review-triage.test.mjs'
      - '.github/workflows/nyxi-agent1-provenance-ledger.yml'
      - 'docs/nyxi/agent1-provenance-ledger-20261023.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/nyxi/governance/attestation-ledger.test.mjs scripts/nyxi/governance/witness-checkpoint.test.mjs scripts/nyxi/governance/checkpoint-continuity.test.mjs scripts/nyxi/governance/private-storage-attestation.test.mjs scripts/nyxi/governance/attestation-batch-plan.test.mjs scripts/nyxi/governance/documentary-rights-evidence.test.mjs scripts/nyxi/governance/rights-review-triage.test.mjs
