name: POLO product structure probe

on:
  push:
    branches:
      - chore/polo-catalogue-crawl
    paths:
      - scripts/catalogue/polo-product-structure-probe.mjs
      - .github/workflows/polo-product-structure-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/catalogue/polo-product-structure-probe.mjs
      - .github/workflows/polo-product-structure-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: polo-product-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe POLO product pages
        run: node scripts/catalogue/polo-product-structure-probe.mjs 2>&1 | tee /tmp/polo-product-structure.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polo-product-structure-${{ github.run_id }}
          path: |
            data/imports/polo-structure-probe/
            /tmp/polo-product-structure.log
          retention-days: 7
      - name: Report on PR
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### POLO product structure probe'
            echo
            echo '```text'
            tail -n 180 /tmp/polo-product-structure.log 2>/dev/null || true
            echo '```'
          } >/tmp/polo-product-structure-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/polo-product-structure-comment.md
