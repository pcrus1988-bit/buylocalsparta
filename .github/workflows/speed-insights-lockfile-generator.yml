name: Speed Insights Lockfile Generator

on:
  push:
    branches:
      - agent/speed-insights-current-main
    paths:
      - ".github/workflows/speed-insights-lockfile-generator.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/speed-insights-current-main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate exact workspace dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact @vercel/speed-insights@2.0.0 --workspace apps/web
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock Vercel Speed Insights dependency"
          git push origin HEAD:agent/speed-insights-current-main
