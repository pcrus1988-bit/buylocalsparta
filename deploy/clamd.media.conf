# KONTA MOU production media scanner.
# ClamAV listens only on loopback inside the media-worker container. It is never
# exposed as a public network service.
Foreground true
TCPSocket 3310
TCPAddr 127.0.0.1
User node
DatabaseDirectory /var/lib/clamav
PidFile /var/run/clamav/clamd.pid
TemporaryDirectory /tmp
LogTime true
LogClean false
MaxConnectionQueueLength 20
MaxThreads 8
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 120
MaxScanTime 120000
MaxScanSize 30M
MaxFileSize 30M
StreamMaxLength 30M
MaxRecursion 16
MaxFiles 10000
ScanArchive true
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanHTML true
AlertEncryptedArchive true
AlertEncryptedDoc true
