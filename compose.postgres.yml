services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: buy_local_sparta
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: buy_local_sparta
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buy_local_sparta -d buy_local_sparta"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - buy-local-sparta-postgres:/var/lib/postgresql

volumes:
  buy-local-sparta-postgres:
